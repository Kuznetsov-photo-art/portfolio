<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Reel 1 — главная по деталям</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Instagram Reel 1080×1920, 20 s, 124 BPM (beat.py). The home page assembles itself top-down from its captured layers (capture.py).
   Deterministic: window.__seek(t) draws the frame at t seconds; record.py turns frames + beat into an MP4 */
html,body{margin:0;background:#000;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:1080px;height:1920px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(async()=>{
const W=1080,H=1920,S=1080/390,BPM=124,BEAT=60/BPM,BAR=4*BEAT,T=20,FPS=30;
const bt=n=>n*BEAT;                                    // time of beat n
const C=document.getElementById('c'), X=C.getContext('2d');
const DISPLAY='Unbounded',BODY="'Golos Text'",MONO="'JetBrains Mono'";
const PAL={dark:{bg:'#0A0A0A',ink:'#F2F2F2',ink2:'#A3A3A3',ink3:'#6B6B6B',rgb:'242,242,242',pill:'#8A8A8A',L:0},
           light:{bg:'#FFFFFF',ink:'#0A0A0A',ink2:'#4A4A4A',ink3:'#8A8A8A',rgb:'10,10,10',pill:'#787878',L:1}};
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const E={o3:t=>1-Math.pow(1-t,3),o5:t=>1-Math.pow(1-t,5),io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  back:t=>{const c=1.7,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);}};
const font=(w,px,f)=>`${w} ${px}px ${f}`;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function spaced(g,s,x,y,ls,al){ let w=0; for(const c of s) w+=g.measureText(c).width+ls; w-=ls; let cx=al==='center'?x-w/2:al==='right'?x-w:x; const a=g.textAlign; g.textAlign='left'; for(const c of s){g.fillText(c,cx,y);cx+=g.measureText(c).width+ls;} g.textAlign=a; return w; }
const a=(K,k)=>`rgba(${K.rgb},${k})`;

/* ---------- assets ---------- */
const man=await (await fetch('cap/manifest.json')).json();
const load=src=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src;});
const IMG={dark:{},light:{}};
const IDS=Object.keys(man).filter(k=>!k.startsWith('_'));
await Promise.all(IDS.flatMap(id=>['dark','light'].map(async th=>{IMG[th][id]=await load(`cap/${id}_${th}.png`);})));
const TILES=(await Promise.all(man._tiles.map(load))).filter(Boolean);
const MQ=man._marquee;
await Promise.all([`300 40px ${DISPLAY}`,`900 40px ${DISPLAY}`,`500 20px ${BODY}`,`400 12px ${MONO}`].map(f=>document.fonts.load(f,'АаДизайн-системыСобираюпродуктыподеталямКузнецовАндрейandrewkuznetsov.com·→×')));

/* ---------- the page, condensed: [id, top (css px), beat, entrance] ---------- */
const P=[
 ['nav',0,8,'drop'],['spec',96,9,'type'],['tag',353,12,'mask'],['meta1',463,13,'wipe'],['meta2',488,13.5,'wipe'],
 ['cases_head',880,16,'drop'],['case1',960,17,'slideR'],['case2',1215,18,'slideL'],['case3',1406,19,'slideR'],
 ['arch_head',1640,20,'drop'],
 ['about_head',2140,23,'drop'],['portrait',2220,24,'pop'],['lead',2600,25,'mask'],['stats',2810,26,'wipe'],
 ['tl1',2950,27,'slideR'],['tl2',3123,28,'slideL'],['tl3',3296,29,'slideR'],
 ['c_title',3490,30,'drop'],['c_row',3590,31,'pop'],['footer',3840,32,'wipe'],
].map(([id,y,b,fx])=>({id,x:man[id].x,y,w:man[id].w,h:man[id].h,b,fx,t:bt(b)}));
const PAGE_END=3960, TOP=170, VIEW=(H-TOP)/S;          // css px visible below the frame labels
const NAME=['Андрей','Кузнецов'], NAME_Y=[207,252], NAME_B=[10,11], NAME_FS=52;
const MQ_Y=570, MQ_B=14, FW_Y=712, FW_B=15, TILE_Y=[1720,1913], TILE_B=[21,22];
// camera: css y of the frame top, eased on every beat
const CAM=[[8,0],[14,110],[15,420],[16,560],[17,780],[18,1000],[19,1190],[20,1420],[21,1560],[22,1740],[23,1930],[24,2140],[25,2380],[26,2560],[27,2700],[28,2870],[29,3040],[30,3200],[31,3270]];
function camY(t){ let y=0; for(let i=0;i<CAM.length;i++){ const [b,v]=CAM[i]; if(t>=bt(b)){ const prev=i?CAM[i-1][1]:0; y=lerp(prev,v,E.io3(seg(t,bt(b),bt(b)+.42))); } } return Math.min(y,PAGE_END-VIEW); }

/* ---------- ink (the site's shader) in an offscreen WebGL canvas ---------- */
const IC=document.createElement('canvas'); IC.width=540; IC.height=960;
const gl=IC.getContext('webgl',{antialias:false,alpha:true,premultipliedAlpha:true,preserveDrawingBuffer:true}); let U;
{ const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;uniform vec2 r;uniform float t;uniform vec2 m;uniform float L;uniform float A;
  vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
  float snoise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;m*=1.79284291400159-.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}
  void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv;p.x*=r.x/r.y;vec2 mm=m;mm.x*=r.x/r.y;float d=length(p-mm);
  float n=snoise(p*1.3+vec2(t*.04,-t*.03));float n2=snoise(p*3.1-vec2(t*.02,t*.05)+n*.8);
  float f=smoothstep(-.2,1.1,n+n2*.5);float ring=exp(-d*2.5)*.25;
  float v=mix(.0,.42,f)+ring; float vig=smoothstep(1.5,.25,length(uv-vec2(.5,.55))); v*=vig*A;
  gl_FragColor=L<.5?vec4(vec3(v),v*.9):vec4(vec3(0.),v*.55);}`;
  const sh=(ty,src)=>{const o=gl.createShader(ty);gl.shaderSource(o,src);gl.compileShader(o);return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  U=n=>gl.getUniformLocation(pr,n); gl.viewport(0,0,540,960); }
function ink(t,K,A){ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U('r'),540,960); gl.uniform1f(U('t'),t*1.6+40); gl.uniform2f(U('m'),.5+.25*Math.sin(t*.7),.5+.2*Math.cos(t*.5)); gl.uniform1f(U('L'),K.L); gl.uniform1f(U('A'),A);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4); return IC; }

/* ---------- drawing helpers (page space = css px of the 390-wide phone layout) ---------- */
function pill(g,K,label,cx,cy,px){ g.font=font(400,px,MONO); const tw=(()=>{let w=0;for(const c of label)w+=g.measureText(c).width+px*.08;return w;})();
  g.fillStyle=K.pill; g.beginPath(); g.roundRect(cx-tw/2-px*.5,cy-px*.7,tw+px,px*1.4,px*.2); g.fill();
  g.fillStyle=K.bg; g.textBaseline='alphabetic'; spaced(g,label,cx,cy+g.measureText('H').actualBoundingBoxAscent/2,px*.08,'center'); }
function detailBox(g,K,p,t){ // hairline box + size pill, flashes in with the piece and fades: «по деталям»
  const k=seg(t,p.t,p.t+.55); if(k<=0||k>=1) return; const al=(1-k)*cl(k*8);
  g.save(); g.globalAlpha=al; g.strokeStyle=a(K,.7); g.lineWidth=1.4/S; g.strokeRect(p.x-3,p.y-3,p.w+6,p.h+6);
  g.lineWidth=2/S; for(const [x,y] of [[p.x-3,p.y-3],[p.x+p.w+3,p.y-3],[p.x-3,p.y+p.h+3],[p.x+p.w+3,p.y+p.h+3]]){ g.beginPath(); g.moveTo(x-5,y); g.lineTo(x+5,y); g.moveTo(x,y-5); g.lineTo(x,y+5); g.stroke(); }
  pill(g,K,`W ${Math.round(p.w)} · H ${Math.round(p.h)}`,p.x+p.w/2,p.y-3,8.5); g.restore(); }
function piece(g,K,th,p,t){
  if(t<p.t) return; const img=IMG[th][p.id]; if(!img) return; const k=seg(t,p.t,p.t+.32), e=E.o5(k);
  g.save();
  if(p.fx==='drop'){ g.globalAlpha=cl(k*3); g.translate(p.x+p.w/2,p.y+p.h/2-(1-e)*60); const s=lerp(1.12,1,e); g.scale(s,s); g.drawImage(img,-p.w/2,-p.h/2,p.w,p.h); }
  else if(p.fx==='slideR'||p.fx==='slideL'){ const d=p.fx==='slideR'?1:-1; g.globalAlpha=cl(k*4); g.transform(1,0,-(1-e)*.25*d,1,(1-e)*320*d,0); g.drawImage(img,p.x,p.y,p.w,p.h); }
  else if(p.fx==='pop'){ g.globalAlpha=cl(k*3); const s=lerp(.72,1,E.back(cl(k*1.1))); g.translate(p.x+p.w/2,p.y+p.h/2); g.scale(s,s); g.drawImage(img,-p.w/2,-p.h/2,p.w,p.h); }
  else if(p.fx==='mask'){ g.beginPath(); g.rect(p.x-4,p.y,p.w+8,p.h*e); g.clip(); g.drawImage(img,p.x,p.y+(1-e)*24,p.w,p.h); }
  else if(p.fx==='wipe'){ g.beginPath(); g.rect(p.x,p.y-2,p.w*e,p.h+4); g.clip(); g.drawImage(img,p.x,p.y,p.w,p.h); }
  else if(p.fx==='type'){ const st=Math.floor(k*16)/16; g.beginPath(); g.rect(p.x,p.y,p.w*st,p.h); g.clip(); g.drawImage(img,p.x,p.y,p.w,p.h); }
  g.restore(); detailBox(g,K,p,t);
}
function name(g,K,t){ // the name, letter by letter, weight 900 → 300 like the hero intro
  g.textBaseline='alphabetic'; g.fillStyle=K.ink;
  NAME.forEach((w,li)=>{ const t0=bt(NAME_B[li]); if(t<t0) return; let x=16; const base=NAME_Y[li]+NAME_FS*.86*.82;
    [...w].forEach((c,i)=>{ const ti=t0+i*BEAT/8, k=seg(t,ti,ti+.26); const wt=Math.round(lerp(900,300,E.o3(seg(t,ti+.05,ti+.6))));
      g.font=font(wt,NAME_FS,DISPLAY); const m=g.measureText(c).width;
      if(k>0){ g.save(); g.globalAlpha=cl(k*3); g.fillText(c,x,base-(1-E.o5(k))*70); g.restore(); }
      x+=m-NAME_FS*.05; }); });
  for(let li=0;li<2;li++){ const t0=bt(NAME_B[li]); const k=seg(t,t0,t0+.6); if(k>0&&k<1){ g.save(); g.globalAlpha=(1-k); g.strokeStyle=a(K,.6); g.lineWidth=1.4/S; g.strokeRect(13,NAME_Y[li]-2,364,46); pill(g,K,`H1 · ${NAME_FS} / 0.86`,195,NAME_Y[li]-2,8.5); g.restore(); } }
}
function marquee(g,K,t){
  const t0=bt(MQ_B); if(t<t0) return; const k=E.o5(seg(t,t0,t0+.45));
  g.save(); g.globalAlpha=cl(seg(t,t0,t0+.1)); g.fillStyle=a(K,.1); g.fillRect(0,MQ_Y,390,1/S); g.fillRect(0,MQ_Y+120,390,1/S);
  const fs=34; g.font=font(300,fs,DISPLAY); g.textBaseline='alphabetic';
  [0,1].forEach(r=>{ const y=MQ_Y+23+r*40+fs*.8, dir=r?1:-1, items=r?[...MQ].reverse():MQ;
    let x=(r?-900:-120)+dir*(t-t0)*55-dir*(1-k)*700;
    for(let rep=0;rep<3;rep++) for(const [txt,o] of items){ let tw=0; for(const c of txt) tw+=g.measureText(c).width-fs*.04;
      if(x>-400&&x<500){ let cx=x; g.lineWidth=1/S*1.4; for(const c of txt){ if(o){ g.strokeStyle=r?K.ink3:K.ink2; g.strokeText(c,cx,y); } else { g.fillStyle=r?K.ink2:K.ink; g.fillText(c,cx,y); } cx+=g.measureText(c).width-fs*.04; }
        g.fillStyle=K.ink3; g.fillRect(x+tw+fs*.45,y-fs*.32,fs*.14,fs*.14); }
      x+=tw+fs*.45*2+fs*.14; } });
  g.restore();
}
function focusWord(g,K,t){
  const t0=bt(FW_B); if(t<t0) return; const k=seg(t,t0,t0+.5);
  g.save(); g.globalAlpha=cl(k*4); g.font=font(400,9,MONO); g.fillStyle=K.ink3; g.textBaseline='alphabetic'; spaced(g,'ЧЕМ ЗАНИМАЮСЬ',16,FW_Y,1);
  g.fillStyle=a(K,.25); g.fillRect(110,FW_Y-3,264*E.o5(k),1/S);
  const word='Дизайн-системы'; let fs=40; g.font=font(300,fs,DISPLAY); let tw=0; for(const c of word) tw+=g.measureText(c).width-fs*.04; fs*=358/tw;
  let x=16; const y=FW_Y+30+fs*.8; g.fillStyle=K.ink;
  [...word].forEach((c,i)=>{ const ti=t0+i*.018, kk=E.o5(seg(t,ti,ti+.3)); const wt=i<2?900:Math.round(lerp(900,300,E.o3(seg(t,ti+.08,ti+.55))));
    g.font=font(wt,fs,DISPLAY); const m=g.measureText(c).width; g.save(); g.beginPath(); g.rect(0,FW_Y+20,390,fs*1.2); g.clip(); g.fillText(c,x,y+(1-kk)*fs); g.restore(); x+=m-fs*.04; });
  g.restore();
}
function tiles(g,K,t){
  TILE_Y.forEach((y,r)=>{ const t0=bt(TILE_B[r]); if(t<t0) return; const k=E.o5(seg(t,t0,t0+.45)), dir=r?1:-1, tw=220, th=165, gap=12;
    let x=(r?-560:-60)+dir*(t-t0)*40-dir*(1-k)*900; const set=TILES.slice(r*10,r*10+10);
    g.save(); g.filter='grayscale(1)';
    for(let rep=0;rep<2;rep++) for(const im of set){ if(x>-tw&&x<390){ g.save(); g.beginPath(); g.roundRect(x,y,tw,th,4); g.clip();
        const s=Math.max(tw/im.width,th/im.height); g.drawImage(im,x+(tw-im.width*s)/2,y+(th-im.height*s)/2,im.width*s,im.height*s); g.restore(); }
      x+=tw+gap; }
    g.restore(); detailBox(g,K,{x:16,y,w:358,h:th,t:t0},t); });
}

/* ---------- frame furniture (screen space) ---------- */
function furniture(g,K,t){
  const k=E.o3(seg(t,.2,1.2)); if(k<=0) return; const m=44;
  g.save(); g.strokeStyle=a(K,.35); g.lineWidth=2;
  for(const [x,y,dx,dy] of [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){ g.beginPath(); g.moveTo(x,y+dy*40*k); g.lineTo(x,y); g.lineTo(x+dx*40*k,y); g.stroke(); }
  g.font=font(400,24,MONO); g.fillStyle=a(K,.6); g.textBaseline='alphabetic';
  spaced(g,'AK / 2026',m+6,m+64,3); spaced(g,'ANDREWKUZNETSOV.COM',W-m-6,m+64,3,'right');
  const f=Math.floor(t*FPS)%FPS, s=Math.floor(t); spaced(g,`00:00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,m+6,m+100,3);
  const beat=Math.max(0,Math.floor(t/BEAT)+1); spaced(g,`${String(Math.min(beat,41)).padStart(2,'0')} / 41`,W-m-6,m+100,3,'right');
  g.restore();
}

/* ---------- scenes ---------- */
function intro(g,K,t){ // 0 … 3.87: dot, type, four words on the beats, silence, drop
  const cx=W/2, cy=H*.46;
  if(t<bt(4)){ const pulse=t<.1?0:1+.45*Math.exp(-((t%BEAT))*9); g.fillStyle=K.ink; g.beginPath(); g.arc(cx,cy,9*pulse*E.back(seg(t,.1,.4)),0,7); g.fill();
    g.font=font(400,28,MONO); g.fillStyle=K.ink2; g.textBaseline='alphabetic'; const s='ANDREW KUZNETSOV — PORTFOLIO 2026'; const n=Math.floor(s.length*seg(t,.35,1.7)); if(n) spaced(g,s.slice(0,n),cx,cy+90,4,'center'); return; }
  const words=['Собираю','продукты','по','деталям'];
  if(t>=bt(7.5)){ // snare roll: flicker, then the half-beat of silence before the drop
    if(t<bt(7.5)+BEAT/2*.98){ const on=Math.floor((t-bt(7.5))/(BEAT/4))%2===0; bigWord(g,K,'деталям',t,bt(7),on?'fill':'stroke'); }
    return; }
  const i=Math.floor(t/BEAT)-4; bigWord(g,K,words[i],t,bt(4+i),i%2?'fill-light':'fill');
}
function bigWord(g,K,w,t,t0,mode){
  const k=seg(t,t0,t0+.14), s=lerp(1.28,1,E.o5(k)); let fs=200; const wt=mode==='fill-light'?300:900;
  g.font=font(wt,fs,DISPLAY); let tw=0; for(const c of w) tw+=g.measureText(c).width-fs*.04; fs=Math.min(fs*940/tw,420); g.font=font(wt,fs,DISPLAY);
  tw=0; for(const c of w) tw+=g.measureText(c).width-fs*.04;
  g.save(); g.translate(W/2,H*.47); g.scale(s,s); g.textBaseline='middle';
  // ghost outline behind, offset — fashion double
  g.lineWidth=2.5; g.strokeStyle=a(K,.35); let x=-tw/2; for(const c of w){ g.strokeText(c,x+14,fs*.12+14); x+=g.measureText(c).width-fs*.04; }
  x=-tw/2; for(const c of w){ if(mode==='stroke'){ g.strokeStyle=K.ink; g.lineWidth=3; g.strokeText(c,x,fs*.12); } else { g.fillStyle=K.ink; g.fillText(c,x,fs*.12); } x+=g.measureText(c).width-fs*.04; }
  g.restore();
  g.font=font(400,24,MONO); g.fillStyle=K.ink3; spaced(g,`${String(Math.round((t0/BEAT)+1)).padStart(2,'0')} — ${w.toUpperCase()}`,W/2,H*.47+fs*.75+40,4,'center');
}
function page(g,K,th,t){ // the build, camera, and the final zoom-out into a column
  const z=E.io3(seg(t,bt(32.5),bt(35.6)));                  // 0 → page shrinks into a column
  const s0=S, s1=1640/PAGE_END, s=lerp(s0,s1,z), cy=camY(t);
  const x0=lerp(0,(W-390*s1)/2,z), y0=lerp(TOP-cy*S,(H-PAGE_END*s1)/2,z), rot=lerp(0,-.07,z);
  g.save(); g.translate(W/2,H/2); g.rotate(rot); g.translate(-W/2,-H/2); g.translate(x0,y0); g.scale(s,s);
  if(z>0){ g.save(); g.globalAlpha=z; g.strokeStyle=a(K,.4); g.lineWidth=1.5/s; g.strokeRect(0,0,390,PAGE_END); g.restore(); }
  P.forEach(p=>piece(g,K,th,p,t)); name(g,K,t); marquee(g,K,t); focusWord(g,K,t); tiles(g,K,t);
  g.restore();
  if(z>0){ // giant outline type behind/around the column
    g.save(); g.globalAlpha=z*.9; g.lineWidth=2.5; g.strokeStyle=a(K,.45); g.font=font(900,250,DISPLAY); g.textBaseline='middle';
    const sh=(t-bt(32.5))*120; ['ПОРТФОЛИО','2026'].forEach((w,i)=>{ let x=(i?W-200+sh:-200-sh); g.save(); g.translate(0,H*(.3+.42*i)); for(const c of w){ g.strokeText(c,x,0); x+=g.measureText(c).width-10; } g.restore(); }); g.restore(); }
}
function finale(g,K,t){ // 17.42 … 20: the address
  const t0=bt(36); const k=seg(t,t0,t0+.6);
  const lines=[['Андрей',300],['Кузнецов',900]]; let fs=170; g.textBaseline='alphabetic';
  lines.forEach(([w,wt],li)=>{ g.font=font(wt,fs,DISPLAY); let tw=0; for(const c of w) tw+=g.measureText(c).width-fs*.05; let x=(W-tw)/2; const y=H*.3+li*fs*.92; // inside the Reels safe zone
    [...w].forEach((c,i)=>{ const ti=t0+li*BEAT*.75+i*.03, kk=E.o5(seg(t,ti,ti+.3)); const ww=Math.round(lerp(900,wt,E.o3(seg(t,ti+.1,ti+.7)))); g.font=font(ww,fs,DISPLAY);
      const m=g.measureText(c).width; g.save(); g.globalAlpha=cl(kk*3); g.fillStyle=K.ink; g.fillText(c,x,y+(1-kk)*90); g.restore(); x+=m-fs*.05; }); });
  const k2=E.o5(seg(t,t0+BEAT*1.5,t0+BEAT*2.2)); if(k2>0){ g.save(); g.globalAlpha=k2;
    // url pill — inverted, like the hero redline labels
    g.font=font(400,40,MONO); let tw=0; const u='ANDREWKUZNETSOV.COM'; for(const c of u) tw+=g.measureText(c).width+4; tw-=4;
    const y=H*.3+fs*.92+150; g.fillStyle=K.ink; g.beginPath(); g.roundRect(W/2-tw/2-28,y-50,tw+56,80,10); g.fill();
    g.fillStyle=K.bg; spaced(g,u,W/2,y+4,4,'center');
    g.font=font(500,40,BODY); g.fillStyle=K.ink2; g.textAlign='center'; g.fillText('Создаю продукты и дизайн-системы',W/2,y+120); g.fillText('вместе с AI, а не вместо него',W/2,y+172); g.textAlign='left';
    g.font=font(400,26,MONO); g.fillStyle=K.ink3; spaced(g,'TG @KUZNETSOV_DESIGNER',W/2,y+250,4,'center'); g.restore(); }
}

/* ---------- glitch, flashes ---------- */
const SNAP=document.createElement('canvas'), TR=document.createElement('canvas'), TC=document.createElement('canvas'), OFF=document.createElement('canvas');
for(const c of [SNAP,TR,TC,OFF]){ c.width=W; c.height=H; }
function rgb(dx,slices,seed){
  const s=SNAP.getContext('2d'); s.clearRect(0,0,W,H); s.drawImage(C,0,0);
  for(const [cv,col] of [[TR,'#ff2850'],[TC,'#00dcff']]){ const q=cv.getContext('2d'); q.globalCompositeOperation='source-over'; q.drawImage(SNAP,0,0); q.globalCompositeOperation='multiply'; q.fillStyle=col; q.fillRect(0,0,W,H); q.globalCompositeOperation='source-over'; }
  // the third channel keeps the picture readable
  X.globalCompositeOperation='source-over'; X.drawImage(SNAP,0,0); X.globalCompositeOperation='lighter'; X.globalAlpha=.55; X.drawImage(TR,dx,0); X.drawImage(TC,-dx,0); X.globalAlpha=1; X.globalCompositeOperation='source-over';
  const r=rng(seed); for(let i=0;i<slices;i++){ const y=Math.floor(r()*H), h=8+Math.floor(r()*90), o=(r()-.5)*120; X.drawImage(SNAP,0,y,W,h,o,y,W,h); }
}
const GL=[[bt(8),.22,22,10],[bt(24),.18,18,8],[bt(36),.26,26,12],[bt(16),.08,8,3],[bt(20),.08,8,3],[bt(28),.08,8,3],[bt(32),.1,10,4]]; // [time, length, px, slices]
const FL=[bt(8),bt(24),bt(36)];

/* ---------- frame ---------- */
function scene(g,th,t){
  const K=PAL[th]; g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.fillStyle=K.bg; g.fillRect(0,0,W,H);
  if(t<bt(8)){ intro(g,K,t); furniture(g,K,t); return; }
  if(t>=bt(36)){ g.drawImage(ink(t,K,1),0,0,W,H); finale(g,K,t); furniture(g,K,t); return; }
  g.drawImage(ink(t,K,E.io(seg(t,bt(8),bt(9)))),0,0,W,H);
  g.save(); g.strokeStyle=a(K,.05); g.lineWidth=2; for(let i=1;i<12;i++){ const x=Math.round(16*S+(358*S)*i/12)+.5; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); } g.restore();
  page(g,K,th,t); furniture(g,K,t);
}
function render(t){
  const F0=bt(24), F1=bt(24)+.42;                            // theme flip: a light circle grows from the centre on the impact (the site's switch)
  const th=t>=F1&&t<bt(36)?'light':'dark';
  scene(X,th,t);
  const fk=seg(t,F0,F1);
  if(fk>0&&fk<1){ const o=OFF.getContext('2d'); scene(o,'light',t); const R=Math.hypot(W,H)/2*E.io3(fk);
    X.save(); X.beginPath(); X.arc(W/2,H*.5,R,0,7); X.clip(); X.drawImage(OFF,0,0); X.restore(); }
  for(const [g0,len,px,sl] of GL){ const k=seg(t,g0,g0+len); if(k>0&&k<1) rgb(px*(1-k)*(Math.floor(t*FPS)%2?1:-1),Math.round(sl*(1-k)),Math.floor(t*FPS)); }
  for(const f of FL){ const k=seg(t,f,f+.12); if(k>0&&k<1){ X.fillStyle=`rgba(255,255,255,${.75*(1-k)})`; X.fillRect(0,0,W,H); } }
  const out=seg(t,T-.45,T); if(out>0){ X.fillStyle=`rgba(0,0,0,${out})`; X.fillRect(0,0,W,H); }
}
window.__seek=t=>render(t); window.__T=T; window.__ready=true;
const q=new URLSearchParams(location.search); if(q.has('t')) render(+q.get('t'));
else { const t0=performance.now(); (function loop(n){ render(((n-t0)/1000)%T); requestAnimationFrame(loop); })(t0); }
})();
