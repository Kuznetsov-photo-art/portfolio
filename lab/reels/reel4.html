<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>REEL2 v2 — product film</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* REEL2 v2: 1080×1920, 22.5 s, 128 BPM (beat3.py → reel2-beat-v2.wav). ?mode=phone | both.
   Reveal · macro details on the beat · tagline · fly-in + fast scroll · drop: devices move together as one, screens snap sections
   and flip theme with the site's circle · finale. The site's glitch (jitter + red/cyan split) on hits and cuts. window.__seek(t) */
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:fixed;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#000}
.world{position:absolute;inset:0;perspective:2600px;perspective-origin:540px 900px}
.glow{position:absolute;inset:0;pointer-events:none}
.dev{position:absolute;transform-style:preserve-3d}
.phone{left:240px;top:250px;width:600px;height:1300px}
.phone .slice{position:absolute;border-radius:74px;background:linear-gradient(90deg,#030304,#26262a 16%,#08080a 46%,#1f1f23 80%,#030304)} /* glossy black */
.phone .front{position:absolute;inset:0;border-radius:74px;background:#030303;box-shadow:inset 0 0 0 1.5px #3c3c42,inset 0 0 0 4px #000}
.phone .screen{position:absolute;inset:13px;border-radius:61px;overflow:hidden;background:#0A0A0A}
.phone .island{position:absolute;left:50%;top:20px;width:140px;height:40px;margin-left:-70px;border-radius:20px;background:#000;z-index:5}
.phone .rim{border-radius:74px}
.phone .dark{border-radius:61px}
.disp{left:40px;top:560px;width:1000px;height:640px}
.disp .lslice{position:absolute;border-radius:26px;background:linear-gradient(180deg,#030304,#25252a 22%,#08080a 50%,#1d1d21 78%,#030304)}
.disp .lback{position:absolute;inset:3px;border-radius:23px;background:linear-gradient(160deg,#18181b,#050506);transform:translateZ(-18px) rotateY(180deg)}
.disp .front{position:absolute;inset:0;border-radius:26px;background:#030303;box-shadow:inset 0 0 0 1.5px #3a3a40,inset 0 0 0 4px #000}
.disp .screen{position:absolute;inset:22px;border-radius:8px;overflow:hidden;background:#0A0A0A}
.disp .rim{border-radius:26px}
.disp .dark{border-radius:8px}
.disp .hdr{position:absolute;left:0;top:0;width:100%;z-index:3}
.page{position:absolute;left:0;top:0;transform-origin:0 0}
.lightlayer{position:absolute;inset:0;z-index:2;background:#fff;overflow:hidden}
.glare{position:absolute;inset:-20%;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.075) 47%,rgba(255,255,255,.02) 53%,transparent 62%);z-index:6;pointer-events:none}
.rim{position:absolute;inset:0;padding:5px;z-index:7;pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,255,255,.75)) drop-shadow(0 0 14px rgba(255,255,255,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.dark{position:absolute;inset:0;background:#000;z-index:8}
.ly{position:absolute}
.ly img{display:block;width:100%;height:100%}
.mq{overflow:hidden}
.mq .row{position:absolute;left:0;white-space:nowrap;font-family:'Unbounded',sans-serif;font-weight:300;letter-spacing:-.04em;line-height:1}
.mq .row span{display:inline-flex;align-items:center;gap:.45em;padding-right:.45em}
.mq .row span::after{content:'';width:.14em;height:.14em;background:var(--sq)}
.fw .lab{font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.fw .word{position:absolute;left:0;font-family:'Unbounded',sans-serif;font-weight:300;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.fw .word b{font-weight:800}
.tiles{overflow:hidden}
.tiles .strip{position:absolute;left:0;top:0;display:flex}
.tiles .strip i{display:block;flex:none;overflow:hidden;background:#000}
.tiles .strip img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.macro{position:absolute;inset:0;perspective:1800px;display:none}
.macro .holder{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:0 0}
.macro img{position:absolute;left:0;top:0;display:block}
.dof{position:absolute;inset:0;pointer-events:none;display:none;-webkit-backdrop-filter:blur(11px);backdrop-filter:blur(11px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 24%,transparent 40%,transparent 60%,#000 76%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,#000 24%,transparent 40%,transparent 60%,#000 76%,#000 100%)}
.type{position:absolute;inset:0;display:none}
.type .ph{position:absolute;left:0;right:0;top:860px;text-align:center;white-space:nowrap}
.type .ph span{display:inline-block;font-family:'Unbounded',sans-serif;font-weight:300;letter-spacing:-.045em;line-height:1.1;
  background:linear-gradient(100deg,#555 0%,#555 30%,#fff 46%,#f2f2f2 54%,#555 70%,#555 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.url{position:absolute;left:0;right:0;top:1550px;text-align:center;font-family:'Golos Text',sans-serif;font-weight:500;font-size:38px;letter-spacing:.01em;color:#A3A3A3;opacity:0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><div id="fx" style="position:absolute;inset:0"><div class="glow" id="glow"></div><div class="world" id="world"></div><div class="dof" id="dof"></div><div class="type" id="type"></div><div class="url" id="url">andrewkuznetsov.com</div></div><div class="black" id="black"></div><div class="flash" id="flash"></div></div>
<script>
(async()=>{
const MODE=new URLSearchParams(location.search).get('mode')||'phone';
const LANG=new URLSearchParams(location.search).get('lang')||'en';   // devices speak English by default; one phone switches to Russian near the end
const SUF=l=>l==='en'?'_en':'';
const BEAT=60/128, T=22.5;
const bt=n=>n*BEAT;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), seg=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const E={o3:t=>1-Math.pow(1-t,3),o5:t=>1-Math.pow(1-t,5),io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,expo:t=>t>=1?1:1-Math.pow(2,-10*t)};
const MANS={ru:await (await fetch('cap/manifest.json')).json(),en:await (await fetch('cap/manifest_en.json')).json()}, man=MANS.ru;
const mac=await (await fetch(`cap/macro${SUF(LANG)}.json`)).json();
await Promise.all([`300 40px Unbounded`,`800 40px Unbounded`,`500 20px 'Golos Text'`,`400 12px 'JetBrains Mono'`].map(f=>document.fonts.load(f,'СоздаюпродуктыидизайнсистемывместесAIДизайн-системыСберВТБФинамandrewkuznetsov.comIdesignproductsandsystemswithWhatIdo')));
const world=document.getElementById('world'), stage=document.getElementById('stage'), FXW=document.getElementById('fx');
const PAL={dark:{bg:'#0A0A0A',ink:'#F2F2F2',ink2:'#A3A3A3',ink3:'#6B6B6B',line:'rgba(242,242,242,.10)'},light:{bg:'#FFFFFF',ink:'#0A0A0A',ink2:'#4A4A4A',ink3:'#8A8A8A',line:'rgba(10,10,10,.10)'}};

/* ---------- phone screen: condensed home page, dark or light ---------- */
const L0=[['nav',0],['spec',96],['name1',man.name1.y],['name2',man.name2.y],['tag',353],['meta1',463],['meta2',488],['mq',570,'dom',390,120],['fw',712,'dom',390,150],
 ['cases_head',880],['case1',960],['case2',1215],['case3',1406],['arch_head',1640],['tiles1',1720,'dom',390,165],['tiles2',1913,'dom',390,165],
 ['about_head',2140],['portrait',2220],['lead',2600],['stats',2810],['tl1',2950],['tl2',3123],['tl3',3296],['c_title',3490],['c_row',3590],['footer',3840]];
const PAGE_END=3960, SC=572/390, SCR_H=1274/SC;
const LAYOUT={};                                               // per language: [ruY, langY] anchors and the page end
for(const lg of ['ru','en']){ const M=MANS[lg]; let shift=0; const anchors=[];
  for(const [id,y,kind] of L0){ anchors.push([y,y+shift]); if(!kind) shift+=M[id].h-MANS.ru[id].h; }
  LAYOUT[lg]={anchors,end:PAGE_END+shift,map:yy=>{ let a=anchors[0]; for(const an of anchors) if(an[0]<=yy) a=an; return yy+(a[1]-a[0]); }}; }
const FW={ru:['Чем занимаюсь','<b>Ди</b>зайн-системы',41.5],en:['What I do','<b>De</b>sign systems',44]};
function phonePage(th,lg=LANG){
  const K=PAL[th], M=MANS[lg], LY=LAYOUT[lg], pg=document.createElement('div'); pg.className='page'; pg._lay=LY;
  Object.assign(pg.style,{width:390*SC+'px',height:LY.end*SC+'px',background:K.bg});
  L0.forEach(([id,y0,kind,w,h],i)=>{ const m=M[id]||{}, y=LY.anchors[i][1]; const d=document.createElement('div'); d.className='ly';
    Object.assign(d.style,{left:(kind?0:m.x)*SC+'px',top:y*SC+'px',width:(kind?w:m.w)*SC+'px',height:(kind?h:m.h)*SC+'px'});
    if(!kind){ const im=new Image(); im.src=`cap/${id}_${th}${SUF(lg)}.png`; d.append(im); }
    else if(id==='mq'){ d.classList.add('mq'); d.style.borderTop=d.style.borderBottom=`1px solid ${K.line}`; d.style.setProperty('--sq',K.ink3);
      [0,1].forEach(r=>{ const row=document.createElement('div'); row.className='row'; row.style.top=(23+r*40)*SC+'px'; row.style.fontSize=34*SC+'px';
        const list=r?[...man._marquee].reverse():man._marquee; row.innerHTML=[...list,...list,...list].map(([t,o])=>`<span style="${o?`color:transparent;-webkit-text-stroke:1.4px ${r?K.ink3:K.ink2}`:`color:${r?K.ink2:K.ink}`}">${t}</span>`).join(''); d.append(row); }); }
    else if(id==='fw'){ d.classList.add('fw'); d.innerHTML=`<div class="lab" style="font-size:${9*SC}px;color:${K.ink3}">${FW[lg][0]}</div><div class="word" style="top:${30*SC}px;font-size:${FW[lg][2]*SC}px;color:${K.ink}">${FW[lg][1]}</div>`; }
    else { d.classList.add('tiles'); const r=id==='tiles2'?1:0, set=man._tiles.slice(r*10,r*10+10), s=document.createElement('div'); s.className='strip'; s.style.gap=12*SC+'px';
      s.innerHTML=[...set,...set].map(src=>`<i style="width:${220*SC}px;height:${165*SC}px;border-radius:${4*SC}px"><img src="${src}"></i>`).join(''); d.append(s); }
    pg.append(d); });
  return pg;
}
/* ---------- display screen: desktop site, a strip of section shots under its header ---------- */
const DSEC=['hero','focus','work','archive','about','tl','contact'], LW=956, DSC=LW/1440;
function dispPage(th){
  const suf=(th==='light'?'_light':'')+SUF(LANG), pg=document.createElement('div'); pg.className='page'; Object.assign(pg.style,{width:LW+'px',height:DSEC.length*900*DSC+'px'});
  DSEC.forEach((s,i)=>{ const im=new Image(); im.src=`cap/d_${s}${suf}.jpg`; Object.assign(im.style,{position:'absolute',left:0,top:i*900*DSC+'px',width:LW+'px',height:900*DSC+'px'}); pg.append(im); });
  return pg;
}
function makeDevice(kind,withRU=false){
  const el=document.createElement('div'); el.className='dev '+kind; let front;
  if(kind==='phone'){ // contoured sides: the frame bulges out a little in the middle of its depth and rounds off to front and back
    for(let i=16;i>=0;i--){ const u=(i-8)/8, ins=-3+7*(1-Math.sqrt(1-u*u)), s=document.createElement('div'); s.className='slice';
      Object.assign(s.style,{inset:ins+'px',borderRadius:(74-ins)+'px',transform:`translateZ(${-1-i*1.75}px)`}); s._b=.7+2.6*Math.exp(-((u/.3)**2)); el.append(s); } }
  else { const back=document.createElement('div'); back.className='lback'; el.append(back);   // contoured aluminium sides, like the phone
    for(let i=12;i>=0;i--){ const u=(i-6)/6, ins=-2+5*(1-Math.sqrt(1-u*u)), s=document.createElement('div'); s.className='lslice';
      Object.assign(s.style,{inset:ins+'px',borderRadius:(26-ins)+'px',transform:`translateZ(${-1-i*1.3}px)`}); s._b=.7+2.6*Math.exp(-((u/.3)**2)); el.append(s); } }
  front=document.createElement('div'); front.className='front'; el.append(front);
  const screen=document.createElement('div'); screen.className='screen'; front.append(screen);
  const page=kind==='phone'?phonePage('dark'):dispPage('dark'); screen.append(page);
  let RL=null, pageR=null;                                      // a Russian copy of the dark page, for the language switch
  if(withRU){ RL=document.createElement('div'); RL.className='rulayer'; Object.assign(RL.style,{position:'absolute',inset:0,zIndex:1,display:'none',background:'#0A0A0A'});
    pageR=phonePage('dark','ru'); RL.append(pageR); screen.append(RL); }
  const LL=document.createElement('div'); LL.className='lightlayer'; const pageL=kind==='phone'?phonePage('light'):dispPage('light'); LL.append(pageL); screen.append(LL);
  if(kind==='disp'){ for(const [im,suf,parent] of [[new Image(),SUF(LANG),screen],[new Image(),'_light'+SUF(LANG),LL]]){ im.src=`cap/d_header${suf}.png`; im.className='hdr'; parent.append(im); } }
  else { const isl=document.createElement('div'); isl.className='island'; screen.append(isl); }
  const glare=document.createElement('div'); glare.className='glare'; screen.append(glare);
  const dark=document.createElement('div'); dark.className='dark'; screen.append(dark);
  const rim=document.createElement('div'); rim.className='rim'; front.append(rim);
  world.append(el);
  return {kind,el,screen,page,pageL,pageR,RL,glare,dark,rim,LL,slices:[...el.querySelectorAll('.slice,.lslice')],front,mqs:[...el.querySelectorAll('.mq')],tiles:[...el.querySelectorAll('.tiles .strip')],
    w:kind==='phone'?572:956, h:kind==='phone'?1272:596};
}
function setDev(p,o){ // x y z rx ry rz s · scroll · light (0..1: circle reveal from the theme toggle) · on · bright · blur · rim · rimA · gl
  if(!(o.op>0)){ p.el.style.display='none'; return; } p.el.style.display='block'; p.el.style.opacity=o.op;
  p.el.style.transform=`translate3d(${o.x||0}px,${o.y||0}px,${o.z||0}px) rotateX(${o.rx||0}deg) rotateY(${o.ry||0}deg) rotateZ(${o.rz||0}deg) scale(${o.s||1})`;
  const G=o.lg||GLI, gt=G?` translateX(${G.dx.toFixed(1)}px) skewX(${G.sk.toFixed(2)}deg)`:'';   // the site's glitch, on the interface only
  const bl=[o.blur>0.05?`blur(${o.blur.toFixed(2)}px)`:'',G&&G.rs?G.f:''].join(' ').trim()||'none';
  for(const pg of [p.page,p.pageL,p.pageR]){ if(!pg) continue;
    let y; if(p.kind==='phone'){ const L=pg._lay; y=cl(L.map(o.scroll||0),0,L.end-SCR_H)*SC; } else y=cl(o.scroll||0,0,DMAX);
    pg.style.transform=`translateY(${-y}px)`+gt; pg.style.filter=bl; }
  if(p.RL) p.RL.style.display=o.ru?'block':'none';
  const lt=o.light||0, tx=p.kind==='phone'?p.w*.87:p.w*.965, ty=p.kind==='phone'?40:22;            // the toggle on the header
  if(lt<=0){ p.LL.style.display='none'; } else { p.LL.style.display='block'; p.LL.style.clipPath=lt>=1?'none':`circle(${(Math.hypot(p.w,p.h)*E.io3(lt)).toFixed(1)}px at ${tx}px ${ty}px)`; }
  p.dark.style.opacity=1-(o.on??1);
  p.screen.style.filter=o.bright>1.01?`brightness(${o.bright.toFixed(2)})`:'none';
  p.glare.style.transform=`translateX(${(-(o.ry||0)*9+(o.gl||0)).toFixed(1)}px)`;
  const lit=o.lit??1; if(p._lit!==lit){ p._lit=lit; p.slices.forEach(s=>s.style.filter=`brightness(${(s._b*lit).toFixed(3)})`);
    const c=Math.round(60*lit); p.front.style.boxShadow=`inset 0 0 0 1.5px rgb(${c},${c},${c+6}),inset 0 0 0 4px #000`; }   // the rim light is never dimmed — it is the light
  const ra=Math.min(1,(o.rimA||0)+.3*lit); p.rim.style.opacity=ra;   // glossy edges always catch a little light
  if(ra>0) p.rim.style.background=`conic-gradient(from ${o.rim||0}deg at 50% 50%,transparent 0deg,rgba(255,255,255,0) 6deg,#fff 34deg,rgba(255,255,255,0) 62deg,transparent 180deg,rgba(255,255,255,0) 186deg,rgba(255,255,255,.55) 214deg,rgba(255,255,255,0) 242deg,transparent 360deg)`;   // light arcs running along the contour
  const t=o.t||0;   // company rows loop forever, in opposite directions (3 copies of the list, the offset wraps by one copy)
  p.mqs.forEach(mq=>mq.querySelectorAll('.row').forEach((r,i)=>{ const w=r._w||(r._w=r.scrollWidth/3), d=((i?200:300)+t*90)%w; r.style.transform=`translateX(${(i?-w+d:-d).toFixed(1)}px)`; }));
  p.tiles.forEach((s,i)=>s.style.transform=`translateX(${i%2?-1800+t*60:-120-t*60}px)`);
}
const SWAP=MODE==='swap';                                       // the display presents first, then the phone takes over
const DISP=MODE==='both'||SWAP?makeDevice('disp'):null;
const PHS=MODE!=='both'?[makeDevice('phone'),makeDevice('phone',LANG==='en'),makeDevice('phone')]:[makeDevice('phone')];

/* ---------- macro shots ---------- */
const SHOTS=[['name',.13,.36,.95,[-16,-8],8],['name',.5,.03,2.6,[14,6],10],['spec',.55,.5,2.2,[-12,-4],6],['ctrls',.74,.5,2.4,[16,6],8],
 ['portrait',.5,.42,1.9,[-10,-3],6],['tag',.74,.2,1.6,[12,4],8],['name',.013,.5,3.2,[-14,-6],4],['name',.5,.72,1.15,[12,5],8]];
const MAC=SHOTS.map(([id,fx,fy,z,ry,rx])=>{ const d=document.createElement('div'); d.className='macro'; const h=document.createElement('div'); h.className='holder';
  const w=mac[id].w*3, hh=mac[id].h*3; const im=new Image(); im.src=`cap/m_${id}${SUF(LANG)}.png`; Object.assign(im.style,{width:w+'px',height:hh+'px'}); h.append(im);
  d.append(h); FXW.insertBefore(d,document.getElementById('dof')); return {d,h,w,hh,fx,fy,z,ry,rx}; });
const DOF=document.getElementById('dof');
const TYPE=document.getElementById('type'); const PHR=LANG==='en'?['I design products','and design systems','with AI']:['Создаю продукты','и дизайн-системы','вместе с AI'];
const PEL=PHR.map(p=>{ const e=document.createElement('div'); e.className='ph'; e.innerHTML=`<span>${p}</span>`; TYPE.append(e); return e.firstChild; });
TYPE.style.display='block'; PEL.forEach(e=>{ e.style.fontSize='100px'; e.style.fontSize=Math.min(160,100*940/e.offsetWidth)+'px'; }); TYPE.style.display='none';
const loaded=i=>i.complete&&i.naturalWidth?1:new Promise(r=>{i.onload=i.onerror=r;});
await Promise.all([...stage.querySelectorAll('img')].map(loaded));
for(let k=0;k<4;k++){ const bad=[...stage.querySelectorAll('img')].filter(i=>!i.naturalWidth); if(!bad.length) break;
  bad.forEach(i=>{ const s=i.getAttribute('src').split('?')[0]; i.src=s+'?r='+k; }); await Promise.all(bad.map(i=>new Promise(r=>{i.onload=i.onerror=r;}))); }
window.__broken=[...stage.querySelectorAll('img')].filter(i=>!i.naturalWidth).length;

/* ---------- sections: the same section on both screens ("one site, every screen") ---------- */
const PSEC=[0,712,880,1640,2140,2950,3490];                    // phone css y for hero, focus, work, archive, about, timeline, contact
const DS=DSEC.map((_,i)=>i*900*DSC), DMAX=(DSEC.length-1)*900*DSC;
const SEC3=[0,520,880,1640,2140,2560,2950,3490];               // phone line-up

/* ---------- the site's glitch: jitter + red/cyan split, ~0.28 s (stronger on the big hits) ---------- */
const GL=[...(MODE==='swap'?[[bt(26.5),1.2]]:[]),[bt(8),1],[bt(16),.8],[bt(28),1.1],[bt(40),1.1],...[9,10,11,12,13,14,15].map(b=>[bt(b),.45]),[bt(16)+8/3*BEAT,.6],[bt(16)+16/3*BEAT,.6]];
const GLX=[[0,-4,0],[.18,5,-2],[.36,-2,0],[.54,3,0],[.72,-1,0],[.9,0,0]], GLS=[[0,3],[.3,-4],[.6,2],[.85,0]];
function glitch(t){ let best=null; for(const [t0,k] of GL){ const p=(t-t0)/.28; if(p>=0&&p<1&&(!best||k>best[1])) best=[p,k]; } return best; }
function stepVal(tab,p){ let v=tab[0]; for(const r of tab) if(p>=r[0]) v=r; return v; }

/* ---------- frame ---------- */
const flash=document.getElementById('flash'), black=document.getElementById('black'), glow=document.getElementById('glow'), url=document.getElementById('url');
let GLI=null;
function render(t){
  { const G=glitch(t); if(G){ const [p,k]=G, [,dx,sk]=stepVal(GLX,p), [,rs]=stepVal(GLS,p);
      GLI={dx:dx*3*k,sk:sk*k,rs,f:rs?`drop-shadow(${(rs*3*k).toFixed(1)}px 0 rgba(255,40,80,.85)) drop-shadow(${(-rs*3*k).toFixed(1)}px 0 rgba(0,220,255,.85))`:''}; } else GLI=null; }
  if(DISP) setDev(DISP,{op:0}); PHS.forEach(p=>setDev(p,{op:0})); MAC.forEach(m=>m.d.style.display='none'); TYPE.style.display='none'; DOF.style.display='none';
  let fl=0, bl=0, g=0; const P0=PHS[0];
  if(t<bt(8)){                                                     // A · reveal from the dark
