<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HERO2 — лаборатория</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Lab page: 15-second motion intro that lands exactly on the HERO1 layout. Not linked from the site */
html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:12px;align-items:center;font:11px/1 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#A3A3A3;background:rgba(17,17,17,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(242,242,242,.1);border-radius:999px;padding:8px 16px;opacity:.3;transition:opacity .3s}
.bar:hover{opacity:1}
.bar button{all:unset;cursor:pointer;color:#F2F2F2;padding:4px 6px}
.bar input{flex:1;min-width:0;accent-color:#F2F2F2}
.bar output{min-width:5ch;text-align:right;color:#F2F2F2}
.clean .bar{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><span>HERO2 · v01</span><button id="pp">Пауза</button><button id="rs">Сначала</button><input id="sc" type="range" min="0" max="15" step="0.01" value="0"><output id="tc">0.0</output></div>
<script>
(()=>{
const C=document.getElementById('c'), MAIN=C.getContext('2d');
let X=MAIN; // every draw call goes to X; swapped to an offscreen context for sampling
const P=new URLSearchParams(location.search); if(P.has('clean')) document.body.classList.add('clean');
const T=15;
const BG='#0A0A0A',INK='#F2F2F2',INK2='#A3A3A3',INK3='#6B6B6B';
const a=k=>`rgba(242,242,242,${k})`;
const DISPLAY='Unbounded',BODY="'Golos Text'",MONO="'JetBrains Mono'";
const NAME=['Андрей','Кузнецов'];
const WORDS=['Продукты','Дизайн-системы','× AI'];
const TAG='Создаю продукты и дизайн-системы — вместе с AI, а не вместо него';
const SPEC=['LEAD PRODUCT DESIGNER','AI & DESIGN SYSTEMS','V14.0 · MOSCOW 55.75° N'];
const META=['ОТКРЫТ К ПРОЕКТАМ · МОСКВА → ВЕСЬ МИР','14 ЛЕТ · СБЕР · ВТБ · ФИНАМ · LAB4U · YOUGILE'];

/* ---------- helpers ---------- */
const cl=(v,lo=0,hi=1)=>Math.min(hi,Math.max(lo,v));
const seg=(t,s,e)=>cl((t-s)/(e-s));
const lerp=(p,q,k)=>p+(q-p)*k;
const E={
  o3:t=>1-Math.pow(1-t,3), o5:t=>1-Math.pow(1-t,5), io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  expo:t=>t>=1?1:1-Math.pow(2,-10*t), io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  back:t=>{const c=1.6,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const font=(w,px,fam)=>`${w} ${px}px ${fam}`;
function spaced(s,x,y,ls,align){ // mono with letter-spacing, drawn char by char (Safari has no ctx.letterSpacing)
  let w=0; for(const c of s) w+=X.measureText(c).width+ls; w-=ls;
  let cx=align==='right'?x-w:align==='center'?x-w/2:x; const sa=X.textAlign; X.textAlign='left';
  for(const c of s){X.fillText(c,cx,y); cx+=X.measureText(c).width+ls;} X.textAlign=sa; return w;
}

/* ---------- layout: mirrors .hero CSS of HERO1 ---------- */
let W,H,DPR,L={};
function wrap(s,max){ // keeps short words with the next one (no hanging «и», «с», «а»)
  const raw=s.split(' '),ws=[];
  for(let i=0;i<raw.length;i++){ if(raw[i].length<=2&&i<raw.length-1){raw[i+1]=raw[i]+' '+raw[i+1];continue;} ws.push(raw[i]); }
  const out=[];let cur='';
  for(const w of ws){const t=cur?cur+' '+w:w; if(X.measureText(t).width>max&&cur){out.push(cur);cur=w;}else cur=t;}
  if(cur) out.push(cur); return out;
}
function layout(){
  const g=cl(W*.04,16,56), hp=Math.max(g,(W-1560)/2+g);
  const fs=cl(W*.115,52,196), tfs=cl(W*.019,18,26);
  const u=cl(Math.min(W/1440,H/860),.45,1.4);
  X.font=font(500,tfs,BODY); const ch=X.measureText('0').width;
  const tagLines=wrap(TAG,ch*24);
  const subTop=H-48-tagLines.length*tfs*1.3;
  const nameBottom=subTop-56;
  const b2=nameBottom-fs*.86*.22, b1=b2-fs*.86;
  const cw=W-2*hp, col2=hp+(cw-40)*1.1/2+40;
  L={g,hp,fs,tfs,u,tagLines,subTop,b1,b2,cw,col2,specTop:96+62};
}
function nameRuns(weights){ // glyph boxes of the name with per-letter weight
  const runs=[];let i=0;
  NAME.forEach((ln,li)=>{let x=L.hp;const y=li?L.b2:L.b1;
    for(const c of ln){const w=weights?weights[i]:300;X.font=font(Math.round(w),L.fs,DISPLAY);const m=X.measureText(c).width;runs.push({c,x,y,w,m,i});x+=m-L.fs*.05;i++;}
  });
  return runs;
}
const NCH=NAME.join('').length;

/* ---------- design-system board ---------- */
function comps(){ return [
  {k:'cursor',x:W*.2,y:H*.36,d:5.0},
  {k:'button',x:W*.45,y:H*.26,d:5.15},
  {k:'toggle',x:W*.72,y:H*.32,d:5.3},
  {k:'chips',x:W*.36,y:H*.54,d:5.45},
  {k:'type',x:W*.74,y:H*.6,d:5.6},
  {k:'ruler',x:W*.2,y:H*.74,d:5.75},
];}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function drawComp(c,k,knob){
  if(k<=0) return null; const u=L.u, e=E.back(k); let kx=null;
  X.save(); X.globalAlpha*=cl(k*2.5); X.translate(c.x,c.y); X.scale(lerp(.55,1,e),lerp(.55,1,e));
  X.textAlign='center'; X.textBaseline='middle';
  if(c.k==='cursor'){ const r=60*u; X.fillStyle=a(.72); X.beginPath(); X.arc(0,0,r,0,7); X.fill(); X.fillStyle=BG; X.font=font(400,12*u,MONO); spaced('ОТКРЫТЬ',0,1,1.6*u,'center');
    X.fillStyle=INK; X.beginPath(); X.arc(r*1.45,-r*1.1,5*u,0,7); X.fill(); }
  if(c.k==='button'){ const w=230*u,h=68*u; X.strokeStyle=INK; X.lineWidth=1.5*u; rr(-w/2,-h/2,w,h,h/2); X.stroke(); X.fillStyle=INK; X.font=font(500,22*u,BODY); X.fillText('Кейсы  →',0,1); }
  if(c.k==='toggle'){ const w=124*u,h=62*u,r=h/2-7*u; X.strokeStyle=INK; X.lineWidth=1.5*u; rr(-w/2,-h/2,w,h,h/2); X.stroke();
    const k2=lerp(-w/2+h/2,w/2-h/2,knob); X.fillStyle=INK; X.beginPath(); X.arc(k2,0,r,0,7); X.fill(); kx=c.x+k2; }
  if(c.k==='chips'){ X.font=font(400,12*u,MONO); const T2=['ТОКЕНЫ','КОМПОНЕНТЫ','ПАТТЕРНЫ'];
    const ws=T2.map(t=>{let w=0;for(const ch of t)w+=X.measureText(ch).width+1.4*u;return w+34*u;}); const tot=ws.reduce((p,q)=>p+q,0)+24*u; let x=-tot/2;
    T2.forEach((t,i)=>{ X.strokeStyle=a(.4); X.lineWidth=1*u; rr(x,-20*u,ws[i],40*u,20*u); X.stroke(); X.fillStyle=INK; spaced(t,x+ws[i]/2,1,1.4*u,'center'); x+=ws[i]+12*u; }); }
  if(c.k==='type'){ X.fillStyle=INK; X.font=font(300,150*u,DISPLAY); X.fillText('Aa',0,0); X.font=font(400,10*u,MONO); X.fillStyle=INK2; spaced('UNBOUNDED · 300 · −0.05EM',0,104*u,1.2*u,'center'); }
  if(c.k==='ruler'){ const S=[4,8,16,24,32,48]; const tot=S.reduce((p,q)=>p+q*1.4*u+18*u,0)-18*u; let x=-tot/2;
    S.forEach(v=>{ const z=v*1.4*u; X.fillStyle=a(.9); X.fillRect(x,-z/2,z,z); X.fillStyle=INK3; X.font=font(400,10*u,MONO); X.fillText(v,x+z/2,48*u); x+=z+18*u; }); }
  X.restore(); return kx;
}
function redline(x1,y1,x2,y2,label,k,alpha=1){ // measuring line with caps, grows with k
  if(k<=0||alpha<=0) return; X.save(); X.globalAlpha=alpha; X.strokeStyle=a(.55); X.lineWidth=1;
  const xe=lerp(x1,x2,k), ye=lerp(y1,y2,k); const hor=Math.abs(x2-x1)>=Math.abs(y2-y1);
  X.beginPath(); X.moveTo(x1+.5,y1+.5); X.lineTo(xe+.5,ye+.5);
  if(hor){X.moveTo(x1+.5,y1-4);X.lineTo(x1+.5,y1+5); if(k>=1){X.moveTo(x2+.5,y2-4);X.lineTo(x2+.5,y2+5);}}
  else {X.moveTo(x1-4,y1+.5);X.lineTo(x1+5,y1+.5); if(k>=1){X.moveTo(x2-4,y2+.5);X.lineTo(x2+5,y2+.5);}}
  X.stroke();
  if(label!=null&&k>.2){ X.font=font(400,10,MONO); X.textBaseline='middle'; X.textAlign='center'; const tw=X.measureText(label).width+label.length*.8;
    const mx=(x1+xe)/2,my=(y1+ye)/2; X.translate(mx,my); if(!hor) X.rotate(-Math.PI/2);
    X.fillStyle=BG; X.fillRect(-tw/2-5,-7,tw+10,14); X.fillStyle=a(.55); spaced(label,0,0,.8,'center'); }
  X.restore();
}

/* ---------- particles: board pixels → name pixels ---------- */
let PT=[];
function sample(draw,step,thr){
  const o=document.createElement('canvas'); o.width=Math.ceil(W); o.height=Math.ceil(H);
  const keep=X; X=o.getContext('2d'); draw(); X=keep;
  const d=o.getContext('2d').getImageData(0,0,o.width,o.height).data, pts=[];
  for(let y=0;y<o.height;y+=step) for(let x=0;x<o.width;x+=step){ if(d[(y*o.width+x)*4+3]>thr) pts.push([x,y]); }
  return pts;
}
function prepare(){
  const step=Math.max(3,Math.round(L.fs/30));
  const tgt=sample(()=>{X.fillStyle='#fff'; X.textBaseline='alphabetic'; nameRuns().forEach(r=>{X.font=font(300,L.fs,DISPLAY);X.fillText(r.c,r.x,r.y);});},step,128);
  const src=sample(()=>comps().forEach(c=>drawComp(c,1,0)),2,60);
  const R=rng(7), runs=nameRuns(), nx0=L.hp, nw=Math.max(...runs.map(r=>r.x+r.m))-nx0;
  PT=tgt.map(([tx,ty])=>{ const s=src.length?src[Math.floor(R()*src.length)]:[W/2,H/2];
    const dx=tx-s[0],dy=ty-s[1],len=Math.hypot(dx,dy)||1, off=(R()-.5)*len*.8;
    return {sx:s[0],sy:s[1],tx:tx+step/2,ty:ty+step/2,cx:(s[0]+tx)/2-dy/len*off,cy:(s[1]+ty)/2+dx/len*off,
      dl:cl((tx-nx0)/nw)*.75+R()*.3, r:step*.47}; });
  L.step=step;
}

/* ---------- scenes ---------- */
function render(t,mx,my){
  X=MAIN; X.setTransform(DPR,0,0,DPR,0,0); X.globalAlpha=1; X.globalCompositeOperation='source-over';
  X.fillStyle=BG; X.fillRect(0,0,W,H);
  const u=L.u, cxm=W/2, cym=H/2;

  /* ink glow (stand-in for the WebGL ink of HERO1) — fades in at the end, keeps drifting */
  const gk=E.io(seg(t,11.8,14.5));
  if(gk>0){ for(let i=0;i<3;i++){ const gx=W*(.7+.08*Math.sin(t*.21+i*2.1)), gy=H*(.5+.1*Math.cos(t*.17+i*1.7)), gr=Math.max(W,H)*(.32+.06*i);
    const gr2=X.createRadialGradient(gx,gy,0,gx,gy,gr); gr2.addColorStop(0,a(.07*gk)); gr2.addColorStop(1,a(0)); X.fillStyle=gr2; X.fillRect(0,0,W,H);} }

  /* A · dot → hairline → 12 columns */
  const dotIn=E.back(seg(t,.15,.6)), split=E.io3(seg(t,1.0,1.7));
  if(t<2.1){ const r=5*dotIn*(1+.35*Math.sin(seg(t,.6,1.0)*Math.PI)); const half=split*W*.5, fade=1-seg(t,1.7,2.1);
    X.globalAlpha=fade; X.fillStyle=INK;
    if(split<=0){X.beginPath();X.arc(cxm,cym,r,0,7);X.fill();}
    else { X.strokeStyle=a(.55); X.lineWidth=1; X.beginPath(); X.moveTo(cxm-half,cym+.5); X.lineTo(cxm+half,cym+.5); X.stroke();
      [cxm-half,cxm+half].forEach(x=>{X.beginPath();X.arc(x,cym,r*(1-split*.4),0,7);X.fill();}); }
    X.globalAlpha=1; }
  // grid columns: draw down, glow brighter during the board, settle to HERO1 (.05 with soft mask)
  { const x0=L.hp-L.g, gw=W-2*x0, endA=.05; let al=lerp(.14,endA,seg(t,11,13.5));
    for(let i=0;i<=12;i++){ const k=E.o5(seg(t,1.3+i*.035,2.2+i*.035)); if(k<=0) continue; const x=Math.round(x0+gw*i/12)+.5;
      const top=0, bot=H*k; const gr=X.createLinearGradient(0,0,0,H); gr.addColorStop(0,a(0)); gr.addColorStop(.3,a(al)); gr.addColorStop(.7,a(al)); gr.addColorStop(1,a(0));
      X.strokeStyle=gr; X.lineWidth=1; X.beginPath(); X.moveTo(x,top); X.lineTo(x,bot); X.stroke(); } }

  /* B · kinetic words, each measured by a redline */
  WORDS.forEach((w,wi)=>{ const t0=2.0+wi*1.0, ti=t-t0; if(ti<0||ti>1.15) return;
    let fsK=L.fs*1.1; X.font=font(900,fsK,DISPLAY); /* fit at the boldest weight the letters pass through */ let ww=0; for(const c of w) ww+=X.measureText(c).width-fsK*.05;
    if(ww>W-2*L.hp){fsK*= (W-2*L.hp)/ww; ww=W-2*L.hp;}
    const y=cym+fsK*.32, lineH=fsK*1.05; let x=L.hp;
    X.save(); X.beginPath(); X.rect(0,y-fsK*.9,W,lineH+fsK*.1); X.clip();
    [...w].forEach((c,i)=>{ const kin=E.o5(seg(ti,i*.028,.5+i*.028)), kout=E.io3(seg(ti,.85+i*.012,1.1+i*.012));
      const wt=lerp(900,300,E.o3(seg(ti,i*.028+.1,.75+i*.028)));
      X.font=font(Math.round(wt),fsK,DISPLAY); const m=X.measureText(c).width;
      const dy=(1-kin)*lineH-kout*lineH; X.fillStyle=INK; X.fillText(c,x,y+dy); x+=m-fsK*.05; });
    X.restore();
    redline(L.hp,y+fsK*.22,L.hp+ww,y+fsK*.22,`W ${Math.round(ww*E.o3(seg(ti,.05,.6)))}`,E.o5(seg(ti,.05,.6)),1-seg(ti,.85,1.05));
  });

  /* C · design-system board, theme flip from the toggle */
  const boardOut=seg(t,8.05,8.35); let knobX=null, knobY=null;
  if(t>4.9&&t<8.4){ X.globalAlpha=1-boardOut; const knob=E.io3(seg(t,6.75,7.05))*(1-E.io3(seg(t,7.55,7.85)));
    comps().forEach(c=>{ const kx=drawComp(c,seg(t,c.d,c.d+.55),knob); if(kx!=null){knobX=kx;knobY=c.y;} });
    // spacing callout between button and toggle
    const cs=comps(), b=cs[1], tg=cs[2]; const k=E.o5(seg(t,6.0,6.5));
    redline(b.x+115*u+8,b.y-60*u,tg.x-62*u-8,b.y-60*u,`${Math.round(tg.x-62*u-b.x-115*u-16)}`,k,1-boardOut);
    redline(cs[0].x-60*u,cs[0].y+80*u,cs[0].x+60*u,cs[0].y+80*u,'64',E.o5(seg(t,6.15,6.6)),1-boardOut);
    X.globalAlpha=1;
    // circular theme reveal from the knob (difference = instant inverse of everything under it)
    if(knobX!=null){ const R=Math.hypot(Math.max(knobX,W-knobX),Math.max(knobY,H-knobY));
      const open=E.io3(seg(t,6.85,7.4)), close=E.io3(seg(t,7.5,8.0)); const r=R*open*(1-close);
      if(r>0.5){ X.globalCompositeOperation='difference'; X.fillStyle='#F5F5F5'; X.beginPath(); X.arc(knobX,knobY,r,0,7); X.fill(); X.globalCompositeOperation='source-over'; } } }

  /* D · board dissolves into dots that fly into the name */
  const flyT=t-8.1;
  const solid=E.io(seg(t,10.5,11.2));
  if(flyT>0&&solid<1){ X.fillStyle=INK; X.beginPath();
    for(const p of PT){ const k=E.io3(cl((flyT-p.dl)/1.45)); const ik=1-k;
      const x=ik*ik*p.sx+2*ik*k*p.cx+k*k*p.tx, y=ik*ik*p.sy+2*ik*k*p.cy+k*k*p.ty;
      const r=lerp(1.1*u,p.r,E.o3(k))*(1-solid); if(r<.2) continue; X.moveTo(x+r,y); X.arc(x,y,r,0,7); }
    X.fill(); }

  /* E · solid name + one weight wave (then follows the pointer, like HERO1) */
  const wv=[]; for(let i=0;i<NCH;i++){ const ph=seg(t,11.0+i*.07,11.9+i*.07); let w=300+600*Math.sin(ph*Math.PI)**2;
    if(t>T&&mx!=null){} wv.push(w); }
  if(t>T&&mx!=null){ const runs=nameRuns(wv); runs.forEach((r,i)=>{ const d=Math.hypot(mx-(r.x+r.m/2),my-(r.y-L.fs*.35)); const f=Math.max(0,1-d/260); HW[i]+=(300+f*f*600-HW[i])*.12; wv[i]=HW[i]; }); }
  else for(let i=0;i<NCH;i++) HW[i]=wv[i];
  if(solid>0){ X.globalAlpha=solid; X.fillStyle=INK; X.textBaseline='alphabetic'; X.textAlign='left';
    nameRuns(wv).forEach(r=>{X.font=font(Math.round(r.w),L.fs,DISPLAY);X.fillText(r.c,r.x,r.y);}); X.globalAlpha=1; }

  /* F · HERO1 furniture: redlines, spec, tagline, meta */
  if(t>11.4){ const runs=nameRuns(); const nw=Math.max(...runs.slice(0,NAME[0].length).map(r=>r.x+r.m))-L.hp;
    const top=L.b1-L.fs*.86*.78-22;
    if(W>860){ redline(L.hp,top,L.hp+600,top,'1440',E.o5(seg(t,11.6,12.8)));
      redline(L.hp-22,top+22,L.hp-22,L.b2+L.fs*.86*.22,`H1 · ${Math.round(L.fs)} / 0.86`,E.o5(seg(t,11.8,13.0))); }
    // spec: types on, top-right
    X.font=font(400,11,MONO); X.textBaseline='alphabetic'; X.fillStyle=INK2;
    SPEC.forEach((s,i)=>{ const n=Math.floor(s.length*seg(t,12.0+i*.25,12.7+i*.25)); if(!n) return; spaced(s.slice(0,n),W-L.hp,L.specTop+i*17,1.1,'right'); });
    // tagline: lines rise from a mask
    X.font=font(500,L.tfs,BODY); X.fillStyle=INK;
    L.tagLines.forEach((ln,i)=>{ const k=E.o5(seg(t,12.3+i*.12,13.3+i*.12)); if(k<=0) return; const y=L.subTop+L.tfs*1.3*(i+1)-L.tfs*.3;
      X.save(); X.beginPath(); X.rect(L.hp,y-L.tfs*1.1,W,L.tfs*1.35); X.clip(); X.fillText(ln.replace(/ /g,' '),L.hp,y+(1-k)*L.tfs*1.3); X.restore(); });
    // meta: red dash grows, then the text
    const mx0=W>860?L.col2:L.hp, mBase=W>860?H-48:H-16;
    META.forEach((s,i)=>{ const y=mBase-(META.length-1-i)*19-4, k=E.o5(seg(t,12.8+i*.15,13.5+i*.15)); if(k<=0) return;
      X.strokeStyle=a(.55); X.beginPath(); X.moveTo(mx0,y-4.5); X.lineTo(mx0+18*k,y-4.5); X.stroke();
      X.globalAlpha=E.o3(seg(t,13.1+i*.15,13.8+i*.15)); X.fillStyle=INK3; X.font=font(400,11,MONO); spaced(s,mx0+28,y,1.1); X.globalAlpha=1; }); }

  /* reel furniture: timecode + label, gone before the hero settles */
  const rf=E.o3(seg(t,.3,.9))*(1-seg(t,11.6,12.4));
  if(rf>0){ X.globalAlpha=rf; X.font=font(400,11,MONO); X.fillStyle=INK3; X.textBaseline='alphabetic';
    const f=Math.floor(t*25)%25, s=Math.floor(t); spaced(`00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,W-L.hp,H-28,1.1,'right');
    spaced('AK — REEL 2026',L.hp,H-28,1.1); X.globalAlpha=1; }
}
const HW=new Array(NCH).fill(300);

/* ---------- clock, controls, recording hooks ---------- */
let t=0,playing=true,last=null,MX=null,MY=null;
const sc=document.getElementById('sc'),tc=document.getElementById('tc'),pp=document.getElementById('pp');
function size(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; C.width=Math.round(W*DPR); C.height=Math.round(H*DPR); X=MAIN; layout(); prepare(); }
function loop(now){ if(playing){ if(last!=null) t+=(now-last)/1000; } last=now;
  render(t,MX,MY); if(t<=T){sc.value=t;} tc.textContent=Math.min(t,T).toFixed(1); requestAnimationFrame(loop); }
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Пауза':'Играть';};
document.getElementById('rs').onclick=()=>{t=0;playing=true;pp.textContent='Пауза';};
sc.oninput=()=>{t=+sc.value;playing=false;pp.textContent='Играть';};
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();pp.click();} if(e.key==='r'||e.key==='к') document.getElementById('rs').click(); });
addEventListener('pointermove',e=>{MX=e.clientX;MY=e.clientY;}); addEventListener('pointerleave',()=>{MX=MY=null;});
addEventListener('resize',size);
window.__seek=s=>{playing=false;t=s;render(t,null,null);};
const need=[`300 40px ${DISPLAY}`,`900 40px ${DISPLAY}`,`500 20px ${BODY}`,`400 11px ${MONO}`];
Promise.all(need.map(f=>document.fonts.load(f,'АаБбAaЙйЁё·→—×'+NAME.join('')+WORDS.join('')))).then(()=>document.fonts.ready).then(()=>{ size(); window.__ready=true; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
