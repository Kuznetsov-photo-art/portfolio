<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HERO2 — лаборатория</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Lab page: 15-second motion intro that lands exactly on the HERO1 layout. Not linked from the site.
   Theme and language come from the same localStorage keys as the site ('theme': ''/'light', 'lang': 'ru'/'en') */
:root{--bg:#0A0A0A;--ink:#F2F2F2;--ink-2:#A3A3A3;--ink-3:#6B6B6B;--panel:rgba(17,17,17,.82);--line:rgba(242,242,242,.1);color-scheme:dark}
:root[data-theme="light"]{--bg:#F2F2F2;--ink:#0A0A0A;--ink-2:#4A4A4A;--ink-3:#8A8A8A;--panel:rgba(255,255,255,.82);--line:rgba(10,10,10,.1);color-scheme:light}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ink{z-index:0}#c{z-index:1}
.bar{position:fixed;z-index:2;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:11px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:8px 16px;opacity:.35;transition:opacity .3s}
.bar:hover,.bar:focus-within{opacity:1}
.bar button{all:unset;cursor:pointer;color:var(--ink);padding:4px 6px}
.bar button:focus-visible{outline:1px solid var(--ink);border-radius:4px}
.bar input{flex:1 1 120px;min-width:0;accent-color:var(--ink)}
.bar output{min-width:4ch;text-align:right;color:var(--ink)}
.clean .bar{display:none}
/* copy of the site preloader (src/index-src.html .pre) to judge the hand-off */
.pre{position:fixed;inset:0;z-index:3;background:var(--bg);transition:transform .9s cubic-bezier(.76,0,.24,1);will-change:transform;--g:clamp(16px,4vw,56px)}
.pre.off{transform:translateY(-100%)}
.pre[hidden]{display:none}
.pre .n{position:absolute;left:var(--g);bottom:calc(var(--g) * .6);font-family:'Unbounded',system-ui,sans-serif;font-weight:300;font-size:clamp(96px,22vw,320px);letter-spacing:-.06em;line-height:.8;color:var(--ink);font-variant-numeric:tabular-nums}
.pre .m{position:absolute;right:var(--g);top:calc(env(safe-area-inset-top,0px) + 24px);text-align:right;display:grid;gap:4px;font:11px/1.5 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pre .l{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.pre .l i{display:block;height:100%;width:0;background:var(--ink)}
</style>
</head>
<body>
<div class="pre" id="pre" hidden><div class="m"><span id="prem"></span><span>Andrew Kuznetsov · Portfolio</span></div><div class="n" id="pren">00</div><div class="l"><i id="prel"></i></div></div>
<canvas id="ink"></canvas>
<canvas id="c"></canvas>
<div class="bar"><span>HERO2 · v03</span><button id="pp">Пауза</button><button id="rs">Сначала</button><button id="rp">С загрузчиком</button><button id="th">Тема</button><button id="lg">RU / EN</button><input id="sc" type="range" min="0" max="15" step="0.01" value="0" aria-label="Время"><output id="tc">0.0</output></div>
<script>
(()=>{
const C=document.getElementById('c'), MAIN=C.getContext('2d');
let X=MAIN; // every draw call goes to X; swapped to an offscreen context for sampling
const P=new URLSearchParams(location.search); if(P.has('clean')) document.body.classList.add('clean');
const T=15;
const DISPLAY='Unbounded',BODY="'Golos Text'",MONO="'JetBrains Mono'";

/* ---------- theme + language: same keys as the site ---------- */
const PAL={
  dark:{bg:'#0A0A0A',ink:'#F2F2F2',ink2:'#A3A3A3',ink3:'#6B6B6B',rgb:'242,242,242',L:0},
  light:{bg:'#F2F2F2',ink:'#0A0A0A',ink2:'#4A4A4A',ink3:'#8A8A8A',rgb:'10,10,10',L:1}
};
const TXT={
  ru:{name:['Андрей','Кузнецов'],words:['Продукты','Дизайн-системы','× AI'],
      tag:'Создаю продукты и дизайн-системы — вместе с AI, а не вместо него',
      meta:['Открыт к проектам · Москва → весь мир','14 лет · Сбер · ВТБ · Финам · Lab4U · YouGile'],
      open:'Открыть',btn:'Кейсы  →',chips:['Токены','Компоненты','Паттерны']},
  en:{name:['Andrew','Kuznetsov'],words:['Products','Design systems','× AI'],
      tag:'I design products and design systems — with AI, not instead of it',
      meta:['Open to projects · Moscow → worldwide','14 years · Sber · VTB · Finam · Lab4U · YouGile'],
      open:'Open',btn:'Cases  →',chips:['Tokens','Components','Patterns']}
};
const SPEC=['Lead Product Designer','AI & Design Systems','v14.0 · Moscow 55.75° N'];
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let theme=P.get('theme')||(store.get('theme')==='light'?'light':'dark');
let lang=P.get('lang')||(store.get('lang')==='en'?'en':'ru');
let K=PAL[theme], S=TXT[lang];
const a=k=>`rgba(${K.rgb},${k})`;
function applyTheme(){ document.documentElement.setAttribute('data-theme',theme); K=PAL[theme]; }

/* ---------- helpers ---------- */
const cl=(v,lo=0,hi=1)=>Math.min(hi,Math.max(lo,v));
const seg=(t,s,e)=>cl((t-s)/(e-s));
const lerp=(p,q,k)=>p+(q-p)*k;
const E={
  o3:t=>1-Math.pow(1-t,3), o5:t=>1-Math.pow(1-t,5), io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  back:t=>{const c=1.6,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const font=(w,px,fam)=>`${w} ${px}px ${fam}`;
const UP=s=>s.toUpperCase();
function spacedW(s,ls){ let w=0; for(const c of s) w+=X.measureText(c).width+ls; return w-ls; }
function spaced(s,x,y,ls,align){ // letter-spaced text drawn char by char (Safari has no ctx.letterSpacing)
  const w=spacedW(s,ls); let cx=align==='right'?x-w:align==='center'?x-w/2:x; const sa=X.textAlign; X.textAlign='left';
  for(const c of s){X.fillText(c,cx,y); cx+=X.measureText(c).width+ls;} X.textAlign=sa; return w;
}

/* ---------- layout: measured from HERO1 (desktop 1440×860, phone 390×844) ---------- */
let W,H,DPR,L={};
function wrapTag(s,max){ // breaks at spaces and after hyphens; one-letter words stay with the next word
  const raw=s.split(' '),ws=[];
  for(let i=0;i<raw.length;i++){ if(raw[i].length===1&&i<raw.length-1){raw[i+1]=raw[i]+' '+raw[i+1];continue;} ws.push(raw[i]); }
  const toks=[]; ws.forEach((w,i)=>{ const parts=w.split(/(?<=-)/); parts.forEach((p,j)=>toks.push({p,sp:j===parts.length-1&&i<ws.length-1})); });
  const out=[];let cur='';
  for(const tk of toks){ const t=cur+tk.p; if(X.measureText(t.trimEnd()).width>max&&cur.trim()){out.push(cur.trimEnd());cur=tk.p+(tk.sp?' ':'');} else cur=t+(tk.sp?' ':''); }
  if(cur.trim()) out.push(cur.trimEnd()); return out;
}
function wrapMono(s,max){ // meta lines wrap between words, as the browser does
  const ws=s.split(' '),out=[];let cur='';
  for(const w of ws){ const t=cur?cur+' '+w:w; if(spacedW(t,1.1)>max&&cur){out.push(cur);cur=w;} else cur=t; }
  if(cur) out.push(cur); return out;
}
function layout(){
  const mob=W<=860;
  const g=cl(W*.04,16,56), hp=Math.max(g,(W-1560)/2+g), cw=W-2*hp;
  const fs=cl(W*.115,52,196), tfs=cl(W*.019,18,26), lh=fs*.86, tlh=tfs*1.3;
  const u=cl(Math.min(W/1440,H/860),.45,1.4);
  X.font=font(300,fs,DISPLAY); let m=X.measureText('АКДрйцAK'); const nBase=(lh-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent;
  X.font=font(500,tfs,BODY); m=X.measureText('Ag'); const tBase=(tlh-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent;
  const tagLines=wrapTag(S.tag,X.measureText('0').width*24);
  const col2=hp+(cw-40)*1.1/2+40;
  X.font=font(400,11,MONO);
  const metaX=mob?hp:col2, metaMax=(mob?W-hp:W-hp)-metaX-28;
  const metaLines=S.meta.map(s=>wrapMono(UP(s),metaMax));
  const metaH=metaLines.reduce((p,q)=>p+q.length*17,0)+8*(metaLines.length-1);
  let specTop,nameTop,tagTop,metaTop;
  if(!mob){ const heroH=Math.min(H*.92,980), subB=heroH-48;
    tagTop=subB-tagLines.length*tlh; metaTop=subB-metaH; nameTop=tagTop-56-2*lh; specTop=62+96; }
  else { specTop=56+40; nameTop=specTop+3*17+2*6+48; tagTop=nameTop+2*lh+56; metaTop=tagTop+tagLines.length*tlh+40; }
  L={mob,g,hp,cw,fs,lh,tfs,tlh,u,tagLines,metaLines,metaX,specTop,nameTop,tagTop,metaTop,tBase,
     b1:nameTop+nBase,b2:nameTop+lh+nBase};
}
function nameRuns(weights){ // glyph boxes of the name with per-letter weight
  const runs=[];let i=0;
  S.name.forEach((ln,li)=>{let x=L.hp;const y=li?L.b2:L.b1;
    for(const c of ln){const w=weights?weights[i]:300;X.font=font(Math.round(w),L.fs,DISPLAY);const m=X.measureText(c).width;runs.push({c,x,y,w,m,i});x+=m-L.fs*.05;i++;}
  });
  return runs;
}
const NCH=()=>S.name.join('').length;

/* ---------- design-system board ---------- */
function comps(){ return L.mob ? [
  {k:'cursor',x:W*.24,y:H*.3,d:5.0},{k:'button',x:W*.55,y:H*.2,d:5.15},{k:'toggle',x:W*.74,y:H*.32,d:5.3},
  {k:'chips',x:W*.5,y:H*.44,d:5.45},{k:'type',x:W*.6,y:H*.56,d:5.6},{k:'ruler',x:W*.42,y:H*.7,d:5.75}
] : [
  {k:'cursor',x:W*.2,y:H*.36,d:5.0},{k:'button',x:W*.45,y:H*.26,d:5.15},{k:'toggle',x:W*.72,y:H*.32,d:5.3},
  {k:'chips',x:W*.36,y:H*.54,d:5.45},{k:'type',x:W*.74,y:H*.6,d:5.6},{k:'ruler',x:W*.2,y:H*.74,d:5.75}
];}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function drawComp(c,k,knob){
  if(k<=0) return null; const u=L.u, e=E.back(k); let kx=null;
  X.save(); X.globalAlpha*=cl(k*2.5); X.translate(c.x,c.y); X.scale(lerp(.55,1,e),lerp(.55,1,e));
  X.textAlign='center'; X.textBaseline='middle';
  if(c.k==='cursor'){ const r=60*u; X.fillStyle=a(.72); X.beginPath(); X.arc(0,0,r,0,7); X.fill(); X.fillStyle=K.bg; X.font=font(400,12*u,MONO); spaced(UP(S.open),0,1,1.6*u,'center');
    X.fillStyle=K.ink; X.beginPath(); X.arc(r*1.45,-r*1.1,5*u,0,7); X.fill(); }
  if(c.k==='button'){ const w=230*u,h=68*u; X.strokeStyle=K.ink; X.lineWidth=1.5*u; rr(-w/2,-h/2,w,h,h/2); X.stroke(); X.fillStyle=K.ink; X.font=font(500,22*u,BODY); X.fillText(S.btn,0,1); }
  if(c.k==='toggle'){ const w=124*u,h=62*u,r=h/2-7*u; X.strokeStyle=K.ink; X.lineWidth=1.5*u; rr(-w/2,-h/2,w,h,h/2); X.stroke();
    const k2=lerp(-w/2+h/2,w/2-h/2,knob); X.fillStyle=K.ink; X.beginPath(); X.arc(k2,0,r,0,7); X.fill(); kx=c.x+k2; }
  if(c.k==='chips'){ X.font=font(400,12*u,MONO); const T2=S.chips.map(UP);
    const ws=T2.map(t=>spacedW(t,1.4*u)+34*u); const tot=ws.reduce((p,q)=>p+q,0)+24*u; let x=-tot/2;
    T2.forEach((t,i)=>{ X.strokeStyle=a(.4); X.lineWidth=1*u; rr(x,-20*u,ws[i],40*u,20*u); X.stroke(); X.fillStyle=K.ink; spaced(t,x+ws[i]/2,1,1.4*u,'center'); x+=ws[i]+12*u; }); }
  if(c.k==='type'){ X.fillStyle=K.ink; X.font=font(300,150*u,DISPLAY); X.fillText('Aa',0,0); X.font=font(400,10*u,MONO); X.fillStyle=K.ink2; spaced('UNBOUNDED · 300 · −0.05EM',0,104*u,1.2*u,'center'); }
  if(c.k==='ruler'){ const S2=[4,8,16,24,32,48]; const tot=S2.reduce((p,q)=>p+q*1.4*u+18*u,0)-18*u; let x=-tot/2;
    S2.forEach(v=>{ const z=v*1.4*u; X.fillStyle=a(.9); X.fillRect(x,-z/2,z,z); X.fillStyle=K.ink3; X.font=font(400,10*u,MONO); X.fillText(v,x+z/2,48*u); x+=z+18*u; }); }
  X.restore(); return kx;
}
function redline(x1,y1,x2,y2,label,k,alpha=1){ // measuring line with caps, grows with k
  if(k<=0||alpha<=0) return; X.save(); X.globalAlpha=alpha; X.strokeStyle=a(.55); X.lineWidth=1;
  const xe=lerp(x1,x2,k), ye=lerp(y1,y2,k); const hor=Math.abs(x2-x1)>=Math.abs(y2-y1);
  x1=Math.round(x1);y1=Math.round(y1);
  X.beginPath(); X.moveTo(x1+.5,y1+.5); X.lineTo(Math.round(xe)+.5,Math.round(ye)+.5);
  if(hor){X.moveTo(x1+.5,y1-4);X.lineTo(x1+.5,y1+5); if(k>=1){X.moveTo(Math.round(x2)+.5,y1-4);X.lineTo(Math.round(x2)+.5,y1+5);}}
  else {X.moveTo(x1-4,y1+.5);X.lineTo(x1+5,y1+.5); if(k>=1){X.moveTo(x1-4,Math.round(y2)+.5);X.lineTo(x1+5,Math.round(y2)+.5);}}
  X.stroke();
  if(label!=null&&k>.2){ X.font=font(400,10,MONO); X.textBaseline='middle'; X.textAlign='center'; const tw=spacedW(label,.8);
    const mx=(x1+xe)/2,my=(y1+ye)/2; X.translate(mx,my); if(!hor) X.rotate(-Math.PI/2);
    X.fillStyle=K.bg; X.fillRect(-tw/2-5,-7,tw+10,14); X.fillStyle=a(.55); spaced(label,0,0,.8,'center'); }
  X.restore();
}
function board(t,alpha){ // returns the toggle knob centre
  const u=L.u; let kn=null; X.save(); X.globalAlpha=alpha;
  const knob=E.io3(seg(t,6.75,7.05))*(1-E.io3(seg(t,7.55,7.85)));
  const cs=comps(); cs.forEach(c=>{ const kx=drawComp(c,seg(t,c.d,c.d+.55),knob); if(kx!=null) kn=[kx,c.y]; });
  const b=cs[1], tg=cs[2];
  if(!L.mob) redline(b.x+115*u+8,b.y-60*u,tg.x-62*u-8,b.y-60*u,`${Math.round(tg.x-62*u-b.x-115*u-16)}`,E.o5(seg(t,6.0,6.5)),alpha);
  redline(cs[0].x-60*u,cs[0].y+80*u,cs[0].x+60*u,cs[0].y+80*u,'64',E.o5(seg(t,6.15,6.6)),alpha);
  X.restore(); return kn;
}

/* ---------- particles: board pixels → name pixels ---------- */
let PT=[];
function sample(draw,step,thr){
  const o=document.createElement('canvas'); o.width=Math.ceil(W); o.height=Math.ceil(H);
  const keep=X; X=o.getContext('2d'); draw(); X=keep;
  const d=o.getContext('2d').getImageData(0,0,o.width,o.height).data, pts=[];
  for(let y=0;y<o.height;y+=step) for(let x=0;x<o.width;x+=step){ if(d[(y*o.width+x)*4+3]>thr) pts.push([x,y]); }
  return pts;
}
function prepare(){
  const step=Math.max(3,Math.round(L.fs/30));
  const tgt=sample(()=>{X.fillStyle='#fff'; X.textBaseline='alphabetic'; nameRuns().forEach(r=>{X.font=font(300,L.fs,DISPLAY);X.fillText(r.c,r.x,r.y);});},step,128);
  const src=sample(()=>comps().forEach(c=>drawComp(c,1,0)),2,60);
  const R=rng(7), runs=nameRuns(), nx0=L.hp, nw=Math.max(...runs.map(r=>r.x+r.m))-nx0;
  PT=tgt.map(([tx,ty])=>{ const s=src.length?src[Math.floor(R()*src.length)]:[W/2,H/2];
    const dx=tx-s[0],dy=ty-s[1],len=Math.hypot(dx,dy)||1, off=(R()-.5)*len*.8;
    return {sx:s[0],sy:s[1],tx:tx+step/2,ty:ty+step/2,cx:(s[0]+tx)/2-dy/len*off,cy:(s[1]+ty)/2+dx/len*off,
      dl:cl((tx-nx0)/nw)*.75+R()*.3, r:step*.47}; });
}

/* ---------- scenes ---------- */
let HW=[];
function render(t,mx,my){
  X=MAIN; X.setTransform(DPR,0,0,DPR,0,0); X.globalAlpha=1; X.globalCompositeOperation='source-over';
  X.clearRect(0,0,W,H);
  const u=L.u, cxm=W/2, cym=H/2;

  /* A · dot → hairline → 12 columns */
  const dotIn=E.back(seg(t,.15,.6)), split=E.io3(seg(t,1.0,1.7));
  if(t<2.1){ const r=5*dotIn*(1+.35*Math.sin(seg(t,.6,1.0)*Math.PI)); const half=split*W*.5;
    X.globalAlpha=1-seg(t,1.7,2.1); X.fillStyle=K.ink;
    if(split<=0){X.beginPath();X.arc(cxm,cym,r,0,7);X.fill();}
    else { X.strokeStyle=a(.55); X.lineWidth=1; X.beginPath(); X.moveTo(cxm-half,Math.round(cym)+.5); X.lineTo(cxm+half,Math.round(cym)+.5); X.stroke();
      [cxm-half,cxm+half].forEach(x=>{X.beginPath();X.arc(x,cym,r*(1-split*.4),0,7);X.fill();}); }
    X.globalAlpha=1; }
  { const x0=L.hp-L.g, gw=W-2*x0, al=lerp(.14,.05,seg(t,11,13.5));
    const gr=X.createLinearGradient(0,0,0,H); gr.addColorStop(0,a(0)); gr.addColorStop(.3,a(al)); gr.addColorStop(.7,a(al)); gr.addColorStop(1,a(0));
    X.strokeStyle=gr; X.lineWidth=1;
    for(let i=0;i<=12;i++){ const k=E.o5(seg(t,1.3+i*.035,2.2+i*.035)); if(k<=0) continue; const x=Math.round(x0+gw*i/12)+.5;
      X.beginPath(); X.moveTo(x,0); X.lineTo(x,H*k); X.stroke(); } }

  /* B · kinetic words, each measured by a redline */
  S.words.forEach((w,wi)=>{ const t0=2.0+wi*1.0, ti=t-t0; if(ti<0||ti>1.15) return;
    let fsK=L.fs*1.1; X.font=font(900,fsK,DISPLAY); /* fit at the boldest weight the letters pass through */ let ww=0; for(const c of w) ww+=X.measureText(c).width-fsK*.05;
    if(ww>W-2*L.hp){fsK*=(W-2*L.hp)/ww; ww=W-2*L.hp;}
    const y=cym+fsK*.32, lineH=fsK*1.05; let x=L.hp;
    X.save(); X.beginPath(); X.rect(0,y-fsK*.9,W,lineH+fsK*.1); X.clip(); X.fillStyle=K.ink; X.textBaseline='alphabetic'; X.textAlign='left';
    [...w].forEach((c,i)=>{ const kin=E.o5(seg(ti,i*.028,.5+i*.028)), kout=E.io3(seg(ti,.85+i*.012,1.1+i*.012));
      const wt=lerp(900,300,E.o3(seg(ti,i*.028+.1,.75+i*.028)));
      X.font=font(Math.round(wt),fsK,DISPLAY); const m=X.measureText(c).width;
      X.fillText(c,x,y+(1-kin)*lineH-kout*lineH); x+=m-fsK*.05; });
    X.restore();
    redline(L.hp,y+fsK*.22,L.hp+ww,y+fsK*.22,`W ${Math.round(ww*E.o3(seg(ti,.05,.6)))}`,E.o5(seg(ti,.05,.6)),1-seg(ti,.85,1.05));
  });

  /* C · design-system board; the toggle flips the theme with a circle, like the site switch */
  if(t>4.9&&t<8.4){ const al=1-seg(t,8.05,8.35); const kn=board(t,al);
    if(kn){ const R=Math.hypot(Math.max(kn[0],W-kn[0]),Math.max(kn[1],H-kn[1]));
      const r=R*E.io3(seg(t,6.85,7.4))*(1-E.io3(seg(t,7.5,8.0)));
      if(r>.5){ const keep=theme; X.save(); X.beginPath(); X.arc(kn[0],kn[1],r,0,7); X.clip();
        K=PAL[keep==='light'?'dark':'light']; X.fillStyle=K.bg; X.fillRect(0,0,W,H); board(t,al); K=PAL[keep]; X.restore(); } } }

  /* D · board dissolves into dots that fly into the name */
  const flyT=t-8.1, solid=E.io(seg(t,10.5,11.2));
  if(flyT>0&&solid<1){ X.fillStyle=K.ink; X.beginPath();
    for(const p of PT){ const k=E.io3(cl((flyT-p.dl)/1.45)); const ik=1-k;
      const x=ik*ik*p.sx+2*ik*k*p.cx+k*k*p.tx, y=ik*ik*p.sy+2*ik*k*p.cy+k*k*p.ty;
      const r=lerp(1.1*u,p.r,E.o3(k))*(1-solid); if(r<.2) continue; X.moveTo(x+r,y); X.arc(x,y,r,0,7); }
    X.fill(); }

  /* E · solid name + one weight wave, then the weight follows the pointer (HERO1 behaviour) */
  const n=NCH(), wv=[]; for(let i=0;i<n;i++){ const ph=seg(t,11.0+i*.07,11.9+i*.07); wv.push(300+600*Math.sin(ph*Math.PI)**2); }
  if(HW.length!==n) HW=wv.slice();
  if(t>T&&mx!=null&&!L.mob){ nameRuns(wv).forEach((r,i)=>{ const d=Math.hypot(mx-(r.x+r.m/2),my-(r.y-L.fs*.35)); const f=Math.max(0,1-d/260); HW[i]+=(300+f*f*600-HW[i])*.12; wv[i]=HW[i]; }); }
  else if(t>T){ for(let i=0;i<n;i++){ HW[i]+=(300-HW[i])*.12; wv[i]=HW[i]; } }
  else HW=wv.slice();
  if(solid>0){ X.globalAlpha=solid; X.fillStyle=K.ink; X.textBaseline='alphabetic'; X.textAlign='left';
    nameRuns(wv).forEach(r=>{X.font=font(Math.round(r.w),L.fs,DISPLAY);X.fillText(r.c,r.x,r.y);}); X.globalAlpha=1; }

  /* F · HERO1 furniture: redlines, spec, tagline, meta */
  if(t>11.4){
    if(!L.mob){ const top=L.nameTop-22;
      redline(L.hp,top,L.hp+L.cw,top,`${Math.round(L.cw)} PX`,E.o5(seg(t,11.6,12.8)));
      redline(L.hp-22,L.nameTop,L.hp-22,L.nameTop+2*L.lh,`H1 · ${Math.round(L.fs)} / 0.86`,E.o5(seg(t,11.8,13.0))); }
    X.font=font(400,11,MONO); X.textBaseline='alphabetic'; X.fillStyle=K.ink2;
    SPEC.forEach((s,i)=>{ const q=UP(s), c=Math.floor(q.length*seg(t,12.0+i*.25,12.7+i*.25)); if(!c) return;
      const y=L.specTop+i*23+12.5; if(L.mob) spaced(q.slice(0,c),L.hp,y,1.1); else spaced(q.slice(0,c),W-L.hp,y,1.1,'right'); });
    X.font=font(500,L.tfs,BODY); X.fillStyle=K.ink;
    L.tagLines.forEach((ln,i)=>{ const k=E.o5(seg(t,12.3+i*.12,13.3+i*.12)); if(k<=0) return; const top=L.tagTop+i*L.tlh;
      X.save(); X.beginPath(); X.rect(L.hp-4,top,W,L.tlh); X.clip(); X.fillText(ln.replace(/ /g,' '),L.hp,top+L.tBase+(1-k)*L.tlh); X.restore(); });
    let y=L.metaTop;
    L.metaLines.forEach((lines,i)=>{ const k=E.o5(seg(t,12.8+i*.15,13.5+i*.15)), ta=E.o3(seg(t,13.1+i*.15,13.8+i*.15));
      if(k>0){ X.strokeStyle=a(.55); X.lineWidth=1; X.beginPath(); X.moveTo(L.metaX,Math.round(y+8.5)+.5); X.lineTo(L.metaX+18*k,Math.round(y+8.5)+.5); X.stroke(); }
      X.globalAlpha=ta; X.fillStyle=K.ink3; X.font=font(400,11,MONO);
      lines.forEach((ln,j)=>{ if(ta>0) spaced(ln,L.metaX+28,y+j*17+12.5,1.1); }); X.globalAlpha=1;
      y+=lines.length*17+8; }); }

  /* reel furniture: timecode + label, gone before the hero settles */
  const rf=E.o3(seg(t,.3,.9))*(1-seg(t,11.6,12.4));
  if(rf>0){ X.globalAlpha=rf; X.font=font(400,11,MONO); X.fillStyle=K.ink3; X.textBaseline='alphabetic';
    const f=Math.floor(t*25)%25, s=Math.floor(t); spaced(`00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,W-L.hp,H-28,1.1,'right');
    spaced('AK — REEL 2026',L.hp,H-28,1.1); X.globalAlpha=1; }
}

/* ---------- ink: the HERO1 WebGL fluid noise; its light ring follows the action ---------- */
const INKC=document.getElementById('ink'), gl=INKC.getContext('webgl',{antialias:false,alpha:true,preserveDrawingBuffer:true});
let inkU=null;
if(gl){
  const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;uniform vec2 r;uniform float t;uniform vec2 m;uniform float L;uniform float A;
  vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
  float snoise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;m*=1.79284291400159-.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}
  void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv;p.x*=r.x/r.y;vec2 mm=m;mm.x*=r.x/r.y;float d=length(p-mm);
  float n=snoise(p*1.3+vec2(t*.04,-t*.03));float n2=snoise(p*3.1-vec2(t*.02,t*.05)+n*.8);
  float f=smoothstep(-.2,1.1,n+n2*.5);float ring=exp(-d*2.5)*.25;
  float v=mix(.0,.42,f)+ring; float vig=smoothstep(1.5,.25,length(uv-vec2(.72,.55))); v*=vig*A;
  /* dark: as HERO1; light: HERO1 washes out to a faint grey, so a faint grey it is */
  gl_FragColor=L<.5?vec4(vec3(v),v*.9):vec4(vec3(0.),v*.14);}`;
  const sh=(ty,src)=>{const o=gl.createShader(ty);gl.shaderSource(o,src);gl.compileShader(o);return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  inkU=n=>gl.getUniformLocation(pr,n);
}
/* where the light ring sits during the reel (x, y from top, 0..1) */
const RING=[[0,.5,.5],[1.0,.5,.5],[2.0,.32,.52],[4.6,.42,.5],[5.6,.45,.42],[6.8,.72,.33],[8.0,.72,.33],[9.4,.42,.62],[11.2,.3,.6],[13.5,.62,.55],[15,.7,.5]];
function ringAt(t){ if(t>=RING[RING.length-1][0]) return RING[RING.length-1].slice(1);
  for(let i=1;i<RING.length;i++) if(t<=RING[i][0]){ const [t0,x0,y0]=RING[i-1],[t1,x1,y1]=RING[i]; const k=E.io(seg(t,t0,t1)); return [lerp(x0,x1,k),lerp(y0,y1,k)]; } return [.7,.5]; }
let rx=.7,ry=.5;
function sizeInk(){ if(!gl) return; const d=Math.min(devicePixelRatio||1,1.5); INKC.width=Math.round(W*d); INKC.height=Math.round(H*d); gl.viewport(0,0,INKC.width,INKC.height); }
function renderInk(t,mx,my,live){
  if(!gl) return; let [x,y]=ringAt(t);
  if(live&&t>T&&mx!=null){ x=mx/W; y=my/H; }
  if(live&&t>T){ rx+=(x-rx)*.04; ry+=(y-ry)*.04; } else { rx=x; ry=y; }
  const A=E.io(seg(t,1.6,3.4))*(1-.35*Math.sin(seg(t,4.9,8.1)*Math.PI)); // quieter behind the board
  gl.uniform2f(inkU('r'),INKC.width,INKC.height); gl.uniform1f(inkU('t'),t+40); gl.uniform2f(inkU('m'),rx,1-ry);
  gl.uniform1f(inkU('L'),K.L); gl.uniform1f(inkU('A'),A); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- clock, controls, recording hooks ---------- */
let t=0,playing=true,last=null,MX=null,MY=null;
const sc=document.getElementById('sc'),tc=document.getElementById('tc'),pp=document.getElementById('pp');
function size(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; C.width=Math.round(W*DPR); C.height=Math.round(H*DPR); X=MAIN; layout(); prepare(); sizeInk(); }
function loop(now){ if(playing){ if(last!=null) t+=(now-last)/1000; } last=now;
  renderInk(t,MX,MY,true); render(t,MX,MY); if(t<=T) sc.value=t; tc.textContent=Math.min(t,T).toFixed(1); requestAnimationFrame(loop); }
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Пауза':'Играть';};
document.getElementById('rs').onclick=()=>{t=0;playing=true;pp.textContent='Пауза';};
document.getElementById('th').onclick=()=>{theme=theme==='light'?'dark':'light'; store.set('theme',theme==='light'?'light':''); applyTheme();};
document.getElementById('lg').onclick=()=>{lang=lang==='ru'?'en':'ru'; store.set('lang',lang); S=TXT[lang]; document.documentElement.lang=lang; size();};
sc.oninput=()=>{t=+sc.value;playing=false;pp.textContent='Играть';};
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space'){e.preventDefault();pp.click();} if(e.code==='KeyR') document.getElementById('rs').click(); });
addEventListener('pointermove',e=>{MX=e.clientX;MY=e.clientY;}); document.addEventListener('pointerleave',()=>{MX=MY=null;});
addEventListener('resize',size);
/* preloader mock: counter 1.7 s, +0.3 s, curtain lifts; the reel starts as the curtain starts */
const PRE={ru:['Загружаем токены','Собираем компоненты','Публикуем библиотеку'],en:['Loading tokens','Assembling components','Publishing library']};
const pre=document.getElementById('pre'), pn=document.getElementById('pren'), pl=document.getElementById('prel'), pm=document.getElementById('prem');
let preOn=false;
function runPre(){ preOn=true; t=0; playing=false; pre.classList.remove('off'); pre.hidden=false; const t0=performance.now();
  (function tick(){ const p=Math.min(1,(performance.now()-t0)/1700), e=1-Math.pow(1-p,2.4), pc=Math.round(e*100);
    pn.textContent=String(pc).padStart(2,'0'); pl.style.width=pc+'%'; pm.textContent=PRE[lang][pc<40?0:pc<80?1:2];
    if(p>=1){ setTimeout(()=>{ pre.classList.add('off'); t=0; last=null; playing=true; pp.textContent='Пауза'; setTimeout(()=>{pre.hidden=true;preOn=false;},1000); },300); return; }
    requestAnimationFrame(tick); })(); }
document.getElementById('rp').onclick=runPre;
/* recording: negative time = preloader (counter −2.0…−0.3 s, hold, curtain lifts 0…0.9 s over the reel) */
const bez=x=>{ // cubic-bezier(.76,0,.24,1), the curtain easing of the site
  let lo=0,hi=1; for(let i=0;i<30;i++){ const m=(lo+hi)/2, bx=3*m*(1-m)*(1-m)*.76+3*m*m*(1-m)*.24+m*m*m; if(bx<x) lo=m; else hi=m; }
  const m=(lo+hi)/2; return 3*m*m*(1-m)+m*m*m; };
function seekPre(s){ if(s>=.9){ pre.hidden=true; return; } pre.hidden=false; pre.style.transition='none';
  const p=cl((s+2)/1.7), e=1-Math.pow(1-p,2.4), pc=Math.round(e*100);
  pn.textContent=String(pc).padStart(2,'0'); pl.style.width=pc+'%'; pm.textContent=PRE[lang][pc<40?0:pc<80?1:2];
  pre.style.transform=`translateY(${-100*bez(cl(s/.9))}%)`; }
window.__seek=s=>{playing=false;t=Math.max(0,s);if(window.__withPre) seekPre(s);renderInk(t,null,null,false);render(t,null,null);};
applyTheme(); S=TXT[lang]; document.documentElement.lang=lang;
const sampleTxt=Object.values(TXT).map(o=>o.name.join('')+o.words.join('')+o.tag).join('')+'·→—×°';
const need=[`300 40px ${DISPLAY}`,`900 40px ${DISPLAY}`,`500 20px ${BODY}`,`400 11px ${MONO}`];
Promise.all(need.map(f=>document.fonts.load(f,sampleTxt))).then(()=>document.fonts.ready).then(()=>{ size(); window.__ready=true; if(!P.has('clean')) runPre(); requestAnimationFrame(loop); });
})();
</script>
